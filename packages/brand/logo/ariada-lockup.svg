<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ariada horizontal lockup — mark + wordmark + tagline.
  All strokes/fills use currentColor; thread accent and white inner
  stroke remain fixed for legibility on the triangle.

  Geometry: triangle 36×36 → wordmark area starts at x=44 → tagline
  baseline below. ViewBox sized to allow standalone use at 220×40.

  Author: Alexander Brichkin (Agonist Development AB), 2026-05-04.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" role="img" aria-label="ariada — the accessibility platform">
  <title>ariada — the accessibility platform</title>
  <!-- Mark: triangle + thread waveform -->
  <g transform="translate(0,2)">
    <polygon points="18,3 4,33 32,33" fill="currentColor" opacity="0.92"/>
    <path d="M11.5,22 C14,18.5 16,18.5 18,22 C20,25.5 22,25.5 24.5,22"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="26"
        font-family="Inter, &quot;Source Sans 3&quot;, system-ui, -apple-system, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="-0.02em"
        fill="currentColor">ariada</text>
  <!-- Tagline -->
  <text x="44" y="38"
        font-family="Inter, &quot;Source Sans 3&quot;, system-ui, -apple-system, sans-serif"
        font-size="9"
        font-weight="500"
        letter-spacing="0.02em"
        fill="currentColor"
        opacity="0.72">the accessibility platform</text>
</svg>
