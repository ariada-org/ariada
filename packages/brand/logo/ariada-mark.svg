<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ariada umbrella mark — triangle (Theseus's path / labyrinth wedge) +
  Ariadne's thread (waveform). Canonical extraction from
  strategy/dashboards/LAYER_ARCHITECTURE_DIAGRAM.html (L0 node).

  Both fill and stroke use currentColor so each site's CSS sets the
  colour via the parent element's `color` property — no hardcoded
  per-site variants.

  Author: RIEMANN (Claude Opus 4.7), 2026-05-04.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="ariada">
  <title>ariada</title>
  <polygon points="18,3 4,33 32,33" fill="currentColor" opacity="0.92"/>
  <path d="M11.5,22 C14,18.5 16,18.5 18,22 C20,25.5 22,25.5 24.5,22"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"/>
</svg>
