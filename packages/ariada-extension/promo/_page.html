<!doctype html>
<!-- Capture-only sample page: renders the SAME sample DOM the panel scans, loads
     the real overlay, and waits for the harness to call __ov.show with the real
     findings so the page numbers match the panel list exactly. Not shipped. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;color:#1f2937;padding:40px 56px;max-width:820px}
  h1{font-size:30px;margin:.2em 0}
  img{display:block;width:220px;height:130px;background:#e5e7eb;border:0}
  form{margin:22px 0;display:flex;flex-direction:column;gap:12px;max-width:380px}
  input{padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:8px}
  button{padding:10px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc}
  a{color:#bbb;background:#fff}
  .cart{display:inline-block;margin-top:16px;padding:10px 18px;border-radius:8px;background:#eef2ff;color:#3730a3;font-weight:600}
</style></head>
<body>
  <div><img src="/hero.jpg" alt=""></div>
  <h1>Spring sale</h1>
  <p>Save on everything this week.</p>
  <form>
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Name">
    <button></button>
  </form>
  <a href="/more">See more</a>
  <div role="button" class="cart">Add to cart</div>
  <script type="module">
    import { createOverlay } from '/packages/overlay/src/overlay.js';
    import '/packages/overlay/src/painters.js';
    window.__ov = createOverlay(document);
  </script>
</body></html>
