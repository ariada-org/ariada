version = 1

# REUSE 3.3 per-package licensing metadata for @ariada-org/ariada-extension.
# Validate: `pipx run reuse lint`. Source/test files also carry inline SPDX
# headers; the globs below cover the config-as-data files that cannot.

# Source + tests + build scripts — EUPL-1.2 (double-coverage with inline headers).
[[annotations]]
path = ["src/**", "tests/**", "scripts/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

# Build / tooling / manifest config — CC0-1.0 (config-as-data).
[[annotations]]
path = ["package.json", "tsconfig.json", "tsconfig.*.json", "public/manifest.json", "vitest.config.ts", "playwright.config.ts", "REUSE.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "CC0-1.0"
