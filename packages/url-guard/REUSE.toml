# REUSE.toml — SPDX-machine-readable licensing metadata for @ariada-org/url-guard
#
# Schema: https://reuse.software/spec-3.3/
# Validate locally: `pnpm dlx reuse lint` or `pipx run reuse lint`
# Discipline: every file is either covered by a glob below OR carries inline
# SPDX-FileCopyrightText + SPDX-License-Identifier headers.

version = 1

[[annotations]]
path = ["src/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = ["REUSE.toml", "package.json", "tsconfig.json", "vitest.config.ts"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = ["LICENSE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"
