<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ariada Accessibility Scan</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 360px;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      button {
        min-height: 32px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        padding: 0 12px;
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        font: inherit;
        cursor: pointer;
      }

      button.secondary {
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
      }

      .toolbar {
        display: flex;
        gap: 8px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        padding: 10px;
        background: var(--figma-color-bg-secondary);
      }

      .metric strong {
        display: block;
        font-size: 20px;
        line-height: 1.1;
      }

      .metric span,
      .empty,
      .meta {
        color: var(--figma-color-text-secondary);
        font-size: 12px;
      }

      ol {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        padding: 10px;
        background: var(--figma-color-bg);
      }

      .finding-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .severity {
        border-radius: 999px;
        padding: 2px 7px;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
      }

      .error {
        background: var(--figma-color-bg-danger);
        color: var(--figma-color-text-ondanger);
      }

      .warning {
        background: var(--figma-color-bg-warning);
        color: var(--figma-color-text-onwarning);
      }

      h2,
      p {
        margin: 0;
      }

      h2 {
        font-size: 13px;
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Ariada Accessibility Scan</h1>
        <div class="toolbar">
          <button id="scan" type="button">Scan</button>
          <button id="close" class="secondary" type="button">Close</button>
        </div>
      </header>
      <section class="summary" aria-label="Scan summary">
        <div class="metric"><strong id="errors">0</strong><span>Errors</span></div>
        <div class="metric"><strong id="warnings">0</strong><span>Warnings</span></div>
        <div class="metric"><strong id="visited">0</strong><span>Nodes</span></div>
      </section>
      <p id="meta" class="meta">Select a frame or component to scan.</p>
      <ol id="findings" aria-label="Accessibility findings"></ol>
    </main>
    <script>
      const scan = document.querySelector('#scan');
      const close = document.querySelector('#close');
      const errors = document.querySelector('#errors');
      const warnings = document.querySelector('#warnings');
      const visited = document.querySelector('#visited');
      const meta = document.querySelector('#meta');
      const findings = document.querySelector('#findings');

      scan.addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'scan-selection' } }, '*'));
      close.addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'close-plugin' } }, '*'));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || message.type !== 'scan-result') return;
        render(message.result);
      };

      function render(result) {
        errors.textContent = String(result.summary.errors);
        warnings.textContent = String(result.summary.warnings);
        visited.textContent = String(result.visitedNodeCount);
        meta.textContent = `${result.selectedNodeCount} selected node(s), ${result.summary.findings} finding(s).`;
        findings.replaceChildren(...result.findings.map(renderFinding));

        if (result.findings.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'No design accessibility findings for the current selection.';
          findings.append(empty);
        }
      }

      function renderFinding(finding) {
        const item = document.createElement('li');
        const head = document.createElement('div');
        const title = document.createElement('h2');
        const severity = document.createElement('span');
        const message = document.createElement('p');
        const help = document.createElement('p');
        const rule = document.createElement('code');

        head.className = 'finding-head';
        title.textContent = finding.nodeName;
        severity.className = `severity ${finding.severity}`;
        severity.textContent = finding.severity;
        message.textContent = finding.message;
        help.className = 'meta';
        help.textContent = finding.help;
        rule.textContent = `${finding.ruleId} · ${finding.wcag}`;

        head.append(title, severity);
        item.append(head, message, help, rule);
        return item;
      }
    </script>
  </body>
</html>
