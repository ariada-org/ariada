<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ariada — Compliance Scan Panel</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    button {
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover, button:focus {
      background: #2a7edd;
      outline: 2px solid #fff;
    }
    #results {
      margin-top: 1rem;
      white-space: pre-wrap;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1 style="font-size:16px;margin:0 0 1rem">Ariada Compliance Scanner</h1>
  <button id="scan-btn" type="button">Scan inspected page</button>
  <div id="results" role="log" aria-live="polite" aria-label="Scan results"></div>
  <script type="module" src="./devtools-entry.js"></script>
  <script type="module">
    import { scanInspectedWindow } from './devtools-entry.js';
    const btn = document.getElementById('scan-btn');
    const results = document.getElementById('results');
    if (btn && results) {
      btn.addEventListener('click', async () => {
        results.textContent = 'Scanning…';
        try {
          const r = await scanInspectedWindow();
          results.textContent = JSON.stringify(r, null, 2);
        } catch (e) {
          results.textContent = 'Error: ' + String(e);
        }
      });
    }
  </script>
</body>
</html>
