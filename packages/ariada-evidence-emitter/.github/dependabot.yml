# Dependabot configuration for @ariada/evidence-emitter
#
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# We track:
#   - npm dependencies (mdx-js, zod, vitest, typescript, eslint, etc.)
#   - GitHub Actions used in workflows
#
# Cadence: npm WEEKLY (minor+patch grouped, majors land as separate PRs);
# github-actions MONTHLY. Security advisories are still raised immediately
# by Dependabot's security-update path regardless of this schedule.

version: 2

updates:
  # ─────────────────────────────────────────────────────────────────
  # 1. npm — weekly minor+patch grouped, separate major
  # ─────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      mdx:
        patterns:
          - '@mdx-js/*'
          - 'remark*'
          - 'rehype*'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # ─────────────────────────────────────────────────────────────────
  # 2. github-actions — monthly, grouped
  # ─────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(actions)'
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
