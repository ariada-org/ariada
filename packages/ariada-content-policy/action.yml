name: 'ariada content-gate'
description: 'Fail a build when published-bound content matches a forbidden-content policy (secrets, internal paths, commercial cross-promo on OSS surfaces).'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  files:
    description: 'Newline- or space-separated list of files to scan. If empty, the workflow should pass the changed files.'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - name: Build content-policy package
      shell: bash
      run: pnpm --filter @ariada-org/content-policy install --frozen-lockfile=false --ignore-scripts && pnpm --filter @ariada-org/content-policy build
    - name: Run content-gate
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        if [ -z "$FILES" ]; then
          echo "content-gate: no files to scan — passing."
          exit 0
        fi
        # shellcheck disable=SC2086 # FILES is a space/newline-separated list of paths, intentional word-splitting
        node packages/ariada-content-policy/dist/cli.js $FILES
