version = 1

# REUSE 3.3 per-package licensing metadata. Source/test files also carry inline
# SPDX headers; the globs below cover config-as-data files that cannot.

# Source + tests + e2e — EUPL-1.2.
[[annotations]]
path = ["src/**", "test/**", "tests/**", "e2e/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

# Build / tooling config — CC0-1.0 (config-as-data).
[[annotations]]
path = ["package.json", "tsconfig.json", "tsconfig.*.json", "vitest.config.ts", "playwright.config.ts", "tsup.config.ts", "README.md", "REUSE.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "CC0-1.0"
