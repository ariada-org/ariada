# REUSE.toml — SPDX-machine-readable licensing metadata
#
# Schema: https://reuse.software/spec-3.3/
# Validate locally: `pnpm dlx reuse lint` or `pipx run reuse lint`

version = 1

# Source code under src/ — EUPL-1.2.
[[annotations]]
path = ["src/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

# Test code under tests/ — EUPL-1.2.
[[annotations]]
path = ["tests/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

# Top-level README + NOTICE + governance docs — CC-BY-SA-4.0.
[[annotations]]
path = ["README.md", "NOTICE"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Build / tooling config — CC0-1.0.
[[annotations]]
path = [
  "package.json",
  "tsconfig.json",
  "vitest.config.ts",
  "REUSE.toml",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "CC0-1.0"
