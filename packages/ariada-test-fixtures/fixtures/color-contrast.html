<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Color Contrast Fixture</title>
  <style>
    body { background: #ffffff; color: #222222; font-family: system-ui; margin: 2rem; }
    .low1 { color: #bbbbbb; background: #ffffff; font-size: 14px; }
    .low2 { color: #eeeeee; background: #f0f0f0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Color contrast demo</h1>
    <p class="low1">This text has insufficient contrast (light grey on white, 14px).</p>
    <p class="low2">Even lighter — near-white on near-white.</p>
  </main>
</body>
</html>
