  <main id="main">
    <section aria-labelledby="cart-items">
      <h2 id="cart-items">Produkter i varukorgen</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Produkt</th>
            <th scope="col">Antal</th>
            <th scope="col">Pris</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Klassisk t-shirt, storlek M</td>
            <td>
              <label for="qty-1">Antal av Klassisk t-shirt</label>

            </td>
            <td>299&nbsp;<abbr title="kronor">kr</abbr></td>
          </tr>
          <tr>
            <td>Bomullsbyxor, storlek 32</td>
            <td>
              <label for="qty-2">Antal av Bomullsbyxor</label>

        <dd>49&nbsp;<abbr title="kronor">kr</abbr></dd>
        <dt>Totalt inklusive moms</dt>
