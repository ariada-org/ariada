Fixture for rule: ariada/statement/non-conformance-items-listed
Detection condition (statement-non-conformance-items.ts):
  isStatementPage: title/h1 matches STATEMENT_TITLE_RE
  If FULL_CONFORMANT and NOT PARTIAL_OR_NON → pass (no need to enumerate)
  If NOT PARTIAL_OR_NON → pass (conformance level not yet declared — other rule)
  If PARTIAL_OR_NON declared AND no ul/ol with ≥1 li → fail
  If PARTIAL_OR_NON declared AND list present BUT no WCAG SC reference → fail

fail-1: statement saying "partially conformant" but no enumeration list or WCAG SC refs
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessibility Statement</title>
</head>
<body>
  <h1>Accessibility Statement</h1>
  <p>This website is partially conformant with WCAG 2.2 Level AA.</p>
  <p>Some content on the site may not yet fully meet accessibility requirements.</p>
  <p>We are working to address known issues in upcoming releases.</p>
  <p>Last updated: 2026-01-15</p>
  <!-- Says "partially conformant" but has no list of specific issues with WCAG SC refs — FAILS -->
</body>
</html>
