Fixture for rule: ariada/statement/last-revision-date
Detection condition (statement-last-revision-date.ts):
  isStatementPage: title/h1 matches STATEMENT_TITLE_RE
  check: statementText matches REVISION_TOKEN_RE
    /\b((last\s+)?updated|(last\s+)?revis|(last\s+)?reviewed|(senast\s+)?uppdater|...)/i
    AND within next 80 chars a NEAR_DATE_RE date:
    /\b\d{1,2}\s+\w+\s+\d{4}|\b\d{4}-\d{2}-\d{2}\b/
  → fail if no revision-token found, or found but no date within 80 chars

fail-1: accessibility statement page with no "last updated/revised/reviewed" date
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessibility Statement</title>
</head>
<body>
  <h1>Accessibility Statement</h1>
  <p>This website is partially conformant with WCAG 2.2 Level AA.</p>
  <p>We self-assessed our site in early 2026.</p>
  <p>For feedback please contact us at accessibility@example.org.</p>
  <!-- No "last updated", "last revised", "last reviewed" with a date — FAILS -->
</body>
</html>
