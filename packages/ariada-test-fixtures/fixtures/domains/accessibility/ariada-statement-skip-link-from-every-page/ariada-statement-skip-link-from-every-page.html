Fixture for rule: ariada/statement/skip-link-from-every-page
Detection condition (statement-skip-link.ts):
  selector: 'html' (fires once per page)
  check: document.querySelectorAll('a[href^="#"]') — any matches isSkipLinkCandidate:
    href starts with '#' AND textContent matches SKIP_TEXT_RE:
      /\b(skip\s+to\s+(main|content)|skip\s+navigation|hoppa\s+till|gå\s+til\s+(innhold|...|siirry\s+...))\b/i
  returns false (fail) if no matching skip-link found

fail-1: page (html root) with no skip-link at all — only generic navigation
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Page — No Skip Link</title>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/products">Products</a>
    <a href="/contact">Contact</a>
    <!-- No skip-to-content link here -->
  </nav>

  <main id="main">
    <h1>Our Products</h1>
    <p>This page has no skip-link so keyboard users must tab through the full
    navigation on every page load. The rule fires because no
    <code>&lt;a href="#..."&gt;</code> with skip-link text is present.</p>
  </main>

  <footer>
    <a href="/accessibility">Accessibility statement</a>
  </footer>
</body>
</html>
