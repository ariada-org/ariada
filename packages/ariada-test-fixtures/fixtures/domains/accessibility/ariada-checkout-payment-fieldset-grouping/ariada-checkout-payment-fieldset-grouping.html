Fixture for rule: ariada/checkout/payment-fieldset-grouping
Detection condition (payment-fieldset-grouping.ts):
  looksLikePaymentRadio: input[type=radio] AND name matches /pay|payment|tender|checkout|method/i
  check: ≥2 radios with same name exist AND
    (no ancestor fieldset with a non-empty legend AND
     no ancestor role=radiogroup with an accessible name) → fail

fail-1: Two radios with name="payment" not inside fieldset+legend or radiogroup
pass-1: Two radios with name="payment-method" inside <fieldset><legend>
pass-2: Two radios with name="payment_method" inside role=radiogroup with aria-label
pass-3: Radio with name="color" — looksLikePaymentRadio returns false (name doesn't match pattern)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/payment-fieldset-grouping fixture</title>
</head>
<body>

  <!-- fail: payment radios without fieldset+legend or role=radiogroup -->
  <form class="checkout-form">
    <div id="fail-1">
      <label><input type="radio" name="payment" value="card"> Credit card</label>
      <label><input type="radio" name="payment" value="invoice"> Invoice</label>
    </div>
  </form>

  <!-- pass: payment radios inside fieldset+legend -->
  <form class="checkout-form">
    <fieldset id="pass-1">
      <legend>Payment method</legend>
      <label><input type="radio" name="payment-method" value="card"> Credit card</label>
      <label><input type="radio" name="payment-method" value="invoice"> Invoice</label>
    </fieldset>
  </form>

  <!-- pass: payment radios inside role=radiogroup with aria-label -->
  <form class="checkout-form">
    <div id="pass-2" role="radiogroup" aria-label="Select payment method">
      <label><input type="radio" name="payment_method" value="swish"> Swish</label>
      <label><input type="radio" name="payment_method" value="card"> Card</label>
    </div>
  </form>

  <!-- pass: radios with a non-payment name — looksLikePaymentRadio returns false -->
  <form>
    <div id="pass-3">
      <label><input type="radio" name="color" value="red"> Red</label>
      <label><input type="radio" name="color" value="blue"> Blue</label>
    </div>
  </form>

</body>
</html>
