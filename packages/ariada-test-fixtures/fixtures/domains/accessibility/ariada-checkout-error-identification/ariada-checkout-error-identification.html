Fixture for rule: ariada/checkout/error-identification
Detection condition (checkout-error-identification.ts):
  looksLikeErrorMessage: id/class matches /error|invalid|fel|virhe|fout|erreur|fehler/i
    EXCEPT if role === 'alert' (that is already correct semantics)
  check: element has non-empty textContent AND
    (no aria-live='polite'/'assertive' or role='alert'/'status' on self/ancestor) AND
    (no field references this element's id via aria-errormessage or aria-describedby)
    → fail

fail-1: div.error with text, no live-region ancestor, not referenced by any input
pass-1: div.invalid with role=alert — looksLikeErrorMessage skips (role===alert)
pass-2: span#card-error referenced by an input via aria-errormessage
pass-3: div.error-message with aria-live="polite"
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/error-identification fixture</title>
</head>
<body>

  <form class="checkout-form">

    <!-- fail: error div with text but no announcement mechanism and no field reference -->
    <div id="fail-1" class="error">
      Please enter a valid email address.
    </div>
    <input type="email" name="email" placeholder="your@email.com">

    <!-- pass: div.invalid with role=alert — looksLikeErrorMessage skips it (role===alert) -->
    <div id="pass-1" class="invalid" role="alert">
      Please enter your name.
    </div>

    <!-- pass: error span referenced by input via aria-errormessage -->
    <label for="card-number">Card number</label>
    <input id="card-number" type="text" name="card" aria-errormessage="pass-2">
    <span id="pass-2" class="error">
      Card number must be 16 digits.
    </span>

    <!-- pass: error div with aria-live="polite" -->
    <div id="pass-3" class="error-message" aria-live="polite">
      Promo code not recognised.
    </div>

  </form>

</body>
</html>
