Fixture for rule: ariada/checkout/cart-update-live-region
Detection condition (cart-update-live-region.ts):
  looksLikeCartRegion: id/class/data-role/data-testid matches /cart|basket|bag|order[-_]?summary|checkout[-_]?summary/i
  check: no aria-live='polite'/'assertive' AND no role='status'/'alert'/'log'
         anywhere on the element or any ancestor → fail

fail-1: div with class="cart-summary" — no live region on self or ancestor
pass-1: div with class="cart" and aria-live="polite"
pass-2: div with id="basket" and role="status"
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/cart-update-live-region fixture</title>
</head>
<body>

  <!-- fail: cart-summary div without any live-region mechanism -->
  <div id="fail-1" class="cart-summary">
    <p>2 items — Total: 299 SEK</p>
  </div>

  <!-- pass: cart div with aria-live -->
  <div id="pass-1" class="cart" aria-live="polite" aria-atomic="true">
    <p>3 items — Total: 449 SEK</p>
  </div>

  <!-- pass: basket div with role=status -->
  <div id="pass-2" role="status">
    <div class="basket">
      <p>1 item — Total: 149 SEK</p>
    </div>
  </div>

</body>
</html>
