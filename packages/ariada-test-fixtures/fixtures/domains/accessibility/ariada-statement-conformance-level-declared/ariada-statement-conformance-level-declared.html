Fixture for rule: ariada/statement/conformance-level-declared
Detection condition (statement-conformance-level.ts):
  isStatementPage: title/h1 matches STATEMENT_TITLE_RE
  check: statementText(document) matches any of CONFORMANCE_PATTERNS:
    /\b(fully|fully\s+conformant|full\s+conformance)\b/i
    /\b(partially|partially\s+conformant|partial\s+conformance)\b/i
    /\b(non[\s-]?conformant|not\s+conformant)\b/i
    (plus Swedish, Norwegian, Danish, Finnish equivalents)
  → fail if none match

fail-1: accessibility statement page with no conformance level declaration
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessibility Statement</title>
</head>
<body>
  <h1>Accessibility Statement</h1>
  <p>Our website aims to meet accessibility requirements.</p>
  <p>We have conducted an internal review using WCAG 2.2 guidelines.</p>
  <!-- No "partially conformant", "fully conformant", "non-conformant" etc. — FAILS -->
</body>
</html>
