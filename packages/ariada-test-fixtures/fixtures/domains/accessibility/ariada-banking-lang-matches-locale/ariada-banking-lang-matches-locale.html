Fixture for rule: ariada/banking/lang-matches-locale
Detection condition (lang-matches-locale.ts):
  check: document must have Nordic script (å/ø/æ/ä/ö) in text — else skips
  detects language via function-word analysis → detected language
  declared = html[lang].split('-')[0].toLowerCase()
  fails if detected !== declared (and declared not empty)
  Norwegian special case: detected='nb', declared in [nb,nn,no] → pass

fail-1: html[lang="en"] page with Swedish text content (å/ö/ä present, Swedish function words)
pass-1: html[lang="sv"] page with Swedish text
pass-2: html[lang="en"] page with English text (no Nordic script → rule skips)
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internetbank — Inloggning</title>
</head>
<body>
  <h1>Välkommen till din internetbank</h1>
  <p>Logga in med ditt personnummer och lösenord för att komma åt ditt konto.
  Välj ett av alternativen nedan för att fortsätta.</p>
  <p>Saldo på ditt sparkonto: 45 000 kr. Nästa förfallodatum är den 15 mars.</p>
  <form>
    <label for="personnummer">Personnummer</label>
    <input id="personnummer" type="text" name="personnummer" autocomplete="username">
    <label for="losenord">Lösenord</label>
    <input id="losenord" type="password" name="losenord" autocomplete="current-password">
    <button type="submit">Logga in</button>
  </form>
  <!-- html[lang="en"] but text is Swedish (å, ö, ä, function words logga/välkommen/och) — FAILS -->
</body>
</html>
