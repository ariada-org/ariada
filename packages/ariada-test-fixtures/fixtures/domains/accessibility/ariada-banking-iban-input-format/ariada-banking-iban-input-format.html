Fixture for rule: ariada/banking/iban-input-format
Detection condition (iban-input-format.ts):
  looksLikeIbanInput: input[type=text|tel] whose name/id/accName matches /\biban\b/i
  check:
    1. accName or name or id must contain 'iban' (already passed by looksLike)
    2. placeholder matches SEGMENTED_FORMAT_RE: /\b[A-Z]{2}\d{2}(\s\d{2,4}){2,}/
       OR aria-describedby references element with such a pattern → pass; else fail

fail-1: text input with name="iban" and placeholder "Enter IBAN" (no format pattern)
pass-1: text input with id="iban" and placeholder "SE45 5000 0000 0583 9825 7466"
pass-2: text input with aria-label="IBAN" and aria-describedby pointing to format example
-->
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/banking/iban-input-format fixture</title>
</head>
<body>

  <form>

    <!-- fail: IBAN input with no segmented-format placeholder or describedby -->
    <div id="fail-1">
      <label for="iban-fail">IBAN</label>
      <input id="iban-fail" type="text" name="iban" placeholder="Enter IBAN">
    </div>

    <!-- pass: placeholder shows segmented IBAN example (SE45 5000 ...) -->
    <div id="pass-1">
      <label for="iban-pass1">IBAN</label>
      <input id="iban-pass1" type="text" name="iban" placeholder="SE45 5000 0000 0583 9825 7466">
    </div>

    <!-- pass: aria-describedby references segmented format -->
    <div id="pass-2">
      <input id="iban-pass2" type="text" aria-label="IBAN" aria-describedby="iban-hint">
      <span id="iban-hint">Example: SE45 3000 0000 0326 1234 5678</span>
    </div>

  </form>

</body>
</html>
