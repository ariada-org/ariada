Fixture for rule: ariada/banking/login-error-not-blocking
Detection condition (bank-login-error-not-blocking.ts):
  isBankLoginContext: document.title matches /\b(log\s*in|sign\s*in|internetbank|nettbank|verkkopankki|kirjautuminen)\b/i
    OR documentURI matches /\/(login|signin|sign-in|bank|internetbank|nettbank|verkkopankki)/i
  check: error elements (class*=error, aria-invalid + message sibling, role=alert)
    each must have role=alert, aria-live=polite/assertive, or live-region ancestor → else fail
  Also: login inputs must not be disabled after error

fail-1: login page (title matches) with error div that has no live-region
pass-1: login page where error is announced via role=alert
pass-2: login page where error is inside aria-live="polite" region
-->
<!DOCTYPE html>
<html lang="en" id="fail-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in to your account</title>
</head>
<body>
  <h1>Log in</h1>
  <form>
    <!-- error div with no live-region — FAILS -->
    <div class="error">
      Incorrect username or password. Please try again.
    </div>
    <label for="username-fail">Username</label>
    <input id="username-fail" type="text" name="username" autocomplete="username">
    <label for="password-fail">Password</label>
    <input id="password-fail" type="password" name="password" autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</body>
</html>
