Fixture for rule: ariada/checkout/form-label-association
Detection condition (checkout-form-label-association.ts):
  fires on: input (not hidden/submit/button/reset/image), select, textarea
    inside a form whose id/class/action/data-role matches checkout context
  check: no aria-label AND
         no valid aria-labelledby (referencing a non-empty element) AND
         no label[for=id] AND
         no wrapping <label> AND
         no title attribute
    → fail

fail-1: text input with no label mechanism inside checkout form
pass-1: text input with aria-label="First name"
pass-2: text input with associated label[for=]
pass-3: select wrapped in <label>
pass-4: textarea with title attribute
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/form-label-association fixture</title>
</head>
<body>

  <form class="checkout-form" action="/checkout">

    <!-- fail: input with no label whatsoever -->
    <div id="fail-1">
      <input type="text" name="company" placeholder="Company name">
    </div>

    <!-- pass: aria-label present -->
    <div id="pass-1">
      <input type="text" name="first_name" aria-label="First name">
    </div>

    <!-- pass: label[for] associated by id -->
    <div id="pass-2">
      <label for="last-name-pass">Last name</label>
      <input id="last-name-pass" type="text" name="last_name">
    </div>

    <!-- pass: select wrapped in label -->
    <div id="pass-3">
      <label>
        Country
        <select name="country">
          <option value="SE">Sweden</option>
          <option value="DE">Germany</option>
        </select>
      </label>
    </div>

    <!-- pass: textarea with title attribute -->
    <div id="pass-4">
      <textarea name="notes" title="Order notes"></textarea>
    </div>

  </form>

</body>
</html>
