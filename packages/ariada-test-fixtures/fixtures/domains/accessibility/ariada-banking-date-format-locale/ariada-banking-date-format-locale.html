Fixture for rule: ariada/banking/date-format-locale
Detection condition (date-format-locale.ts):
  looksLikeDateInput: input[type=text|tel] (not type=date) whose name/id/accName
    matches /\b(date|datum|dato|p[äa]iv[äa]|due|payment[-_ ]?date|payday|maksupäivä)\b/i
  check: placeholder or accessible name matches FORMAT_HINT_RE:
    /(yyyy|åååå|vvvv)[-/.](mm)[-/.](dd|tt)|(dd|tt)[-/.]?(mm|kk)[-/.]?(yyyy|åååå|vvvv)/i
    OR aria-describedby references element with format hint → pass; else fail

fail-1: text input with name="date" and no format hint in placeholder or aria-describedby
pass-1: text input with name="datum" and placeholder="yyyy-mm-dd"
pass-2: text input with name="payment_date" and aria-describedby pointing to format hint
pass-3: input[type=date] — looksLikeDateInput returns false (native date input excluded)
-->
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/banking/date-format-locale fixture</title>
</head>
<body>

  <form>

    <!-- fail: date text input with no format hint -->
    <div id="fail-1">
      <label for="date-fail">Payment date</label>
      <input id="date-fail" type="text" name="date" placeholder="Enter a date">
    </div>

    <!-- pass: placeholder with yyyy-mm-dd format hint -->
    <div id="pass-1">
      <label for="datum-pass">Datum</label>
      <input id="datum-pass" type="text" name="datum" placeholder="yyyy-mm-dd">
    </div>

    <!-- pass: aria-describedby points to format hint text -->
    <div id="pass-2">
      <label for="payday-pass">Payment date</label>
      <input id="payday-pass" type="text" name="payment_date" aria-describedby="date-hint">
      <span id="date-hint">Format: dd/mm/yyyy</span>
    </div>

    <!-- pass: type=date — natively handled, looksLikeDateInput returns false -->
    <div id="pass-3">
      <label for="native-date-pass">Due date</label>
      <input id="native-date-pass" type="date" name="due_date">
    </div>

  </form>

</body>
</html>
