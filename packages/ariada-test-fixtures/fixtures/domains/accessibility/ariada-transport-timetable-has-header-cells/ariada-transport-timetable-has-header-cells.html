Fixture for rule: ariada/transport/timetable-has-header-cells
Detection condition (timetable-has-header-cells.ts):
  looksLikeTimetable: tagName === 'table' AND data-timetable attribute present
  check: no <th> whose closest('table') === this table → fail

fail-1: <table data-timetable> with only <td> cells (no <th>)
pass-1: <table data-timetable> with <th> header cells in the first row
pass-2: <table> without data-timetable — not in scope
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/transport/timetable-has-header-cells fixture</title>
</head>
<body>

  <!-- fail: timetable with no <th> cells — screen reader cannot identify columns -->
  <table id="fail-1" data-timetable>
    <tbody>
      <tr>
        <td>08:15</td>
        <td>Stockholm C</td>
        <td>Gothenburg C</td>
        <td>Track 3</td>
      </tr>
      <tr>
        <td>09:30</td>
        <td>Stockholm C</td>
        <td>Malmö C</td>
        <td>Track 7</td>
      </tr>
    </tbody>
  </table>

  <!-- pass: timetable with <th> header cells and scope attribute -->
  <table id="pass-1" data-timetable aria-label="Departures from Stockholm C">
    <thead>
      <tr>
        <th scope="col">Departure</th>
        <th scope="col">From</th>
        <th scope="col">To</th>
        <th scope="col">Platform</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>08:15</td>
        <td>Stockholm C</td>
        <td>Gothenburg C</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>

  <!-- pass: ordinary table without data-timetable — looksLikeTimetable returns false -->
  <table id="pass-2">
    <tbody>
      <tr><td>Not a timetable</td><td>No header needed by this rule</td></tr>
    </tbody>
  </table>

</body>
</html>
