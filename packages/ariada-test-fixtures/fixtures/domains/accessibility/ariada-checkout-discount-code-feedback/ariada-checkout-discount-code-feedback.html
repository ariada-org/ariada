Fixture for rule: ariada/checkout/discount-code-feedback
Detection condition (discount-code-feedback.ts):
  looksLikeCouponField: input[type=text] whose name/id/label matches
    /coupon|promo|discount|voucher|rabatt|kupong|gutschein|bon de reduction|kortingscode/i
  check: no aria-describedby pointing to an element with role=status/alert or aria-live
         AND no ancestor with aria-live/role=status/alert
         → fail

fail-1: input#promo with no aria-describedby and no live-region ancestor
pass-1: input#discount with aria-describedby pointing to a role=status span
pass-2: input#coupon inside a div with aria-live="polite"
pass-3: input[type=email] with name "promo_email" — looksLikeCouponField false (type is not text)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/discount-code-feedback fixture</title>
</head>
<body>

  <form class="checkout-form">

    <!-- fail: promo field with no feedback mechanism -->
    <div id="fail-1">
      <label for="promo-fail">Promo code</label>
      <input id="promo-fail" type="text" name="promo">
      <button type="button">Apply</button>
    </div>

    <!-- pass: discount field with aria-describedby pointing to role=status -->
    <div id="pass-1">
      <label for="discount-pass">Discount code</label>
      <input id="discount-pass" type="text" name="discount" aria-describedby="discount-result">
      <button type="button">Apply</button>
      <span id="discount-result" role="status"></span>
    </div>

    <!-- pass: coupon field inside a live-region ancestor -->
    <div id="pass-2" aria-live="polite">
      <label for="coupon-pass">Coupon code</label>
      <input id="coupon-pass" type="text" name="coupon">
      <button type="button">Apply</button>
    </div>

    <!-- pass: type=email with "promo" in name — not type=text so looksLikeCouponField false -->
    <div id="pass-3">
      <label for="promo-email-pass">Promo email</label>
      <input id="promo-email-pass" type="email" name="promo_email">
    </div>

  </form>

</body>
</html>
