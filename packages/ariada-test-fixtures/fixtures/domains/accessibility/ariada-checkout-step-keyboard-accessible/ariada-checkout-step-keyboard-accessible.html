Fixture for rule: ariada/checkout/step-keyboard-accessible
Detection condition (checkout-step-keyboard.ts):
  looksLikeStep: id/class/data-role matches
    /step|stepper|progress|checkout[-_]?step|wizard[-_]?step/i
  isClickable: has onclick attribute OR role=button OR class contains 'clickable'
  isFocusable: tagName is a/button/input/select/textarea OR has tabindex ≥ 0
  check: looksLikeStep AND isClickable AND NOT isFocusable → fail

fail-1: div.checkout-step with onclick and role=button but no tabindex or native interactive tag
pass-1: div.step with onclick and tabindex="0" — focusable
pass-2: button.checkout-step with onclick — native button is natively focusable
pass-3: div.step with no onclick and no role=button — not clickable, rule does not fail
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/checkout/step-keyboard-accessible fixture</title>
</head>
<body>

  <ol class="checkout-progress">

    <!-- fail: step div with onclick and role=button but no tabindex -->
    <li>
      <div id="fail-1" class="checkout-step" role="button" onclick="goToStep(1)">
        1. Shipping
      </div>
    </li>

    <!-- pass: step div with onclick AND tabindex="0" -->
    <li>
      <div id="pass-1" class="step" role="button" onclick="goToStep(2)" tabindex="0">
        2. Payment
      </div>
    </li>

    <!-- pass: native button element with class "checkout-step" -->
    <li>
      <button id="pass-2" class="checkout-step" onclick="goToStep(3)" type="button">
        3. Review
      </button>
    </li>

    <!-- pass: div.step without onclick or role=button — not clickable, check skips -->
    <li>
      <div id="pass-3" class="step">
        4. Confirmation
      </div>
    </li>

  </ol>

</body>
</html>
