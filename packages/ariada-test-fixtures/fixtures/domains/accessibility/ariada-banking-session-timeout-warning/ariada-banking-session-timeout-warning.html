Fixture for rule: ariada/banking/session-timeout-warning
Detection condition (session-timeout-warning.ts):
  looksLikeTimeoutWarning: (role=alertdialog|dialog AND class/id matches
    /timeout|inactivity|session|expire|utgång|utløp|umpeutu/i)
    OR class/id matches /\b(timeout|inactivity|session-warning|...)\b/i
  check: any button/role=button/a[href]/input[submit] inside whose accessible name
    matches EXTEND_TEXT_RE:
    /\b(extend|continue|stay\s+(signed|logged)|forlæng|fortsätt|...)/i
  → pass if found, fail if none

fail-1: role=alertdialog with class "session-timeout" but no extend button
pass-1: role=alertdialog with class "session-timeout" AND button with "Extend session"
pass-2: div with class "inactivity-warning" AND button with "Continue"
pass-3: div with class "product-card" — looksLikeTimeoutWarning returns false
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ariada/banking/session-timeout-warning fixture</title>
</head>
<body>

  <!-- fail: timeout dialog with no extend/continue button -->
  <div id="fail-1" role="alertdialog" class="session-timeout"
       aria-labelledby="timeout-title-fail" aria-modal="true">
    <h2 id="timeout-title-fail">Your session is about to expire</h2>
    <p>You will be logged out in 60 seconds.</p>
    <button type="button">OK</button>
  </div>

  <!-- pass: timeout dialog with "Extend session" button -->
  <div id="pass-1" role="alertdialog" class="session-timeout"
       aria-labelledby="timeout-title-pass1" aria-modal="true">
    <h2 id="timeout-title-pass1">Your session is about to expire</h2>
    <p>You will be logged out in 60 seconds.</p>
    <button type="button">Extend session</button>
    <button type="button">Log out now</button>
  </div>

  <!-- pass: inactivity warning with "Continue" button -->
  <div id="pass-2" class="inactivity-warning" role="dialog"
       aria-label="Inactivity warning">
    <p>You have been inactive for 10 minutes. Continue to stay logged in.</p>
    <button type="button">Continue</button>
  </div>

  <!-- pass: unrelated div — looksLikeTimeoutWarning returns false -->
  <div id="pass-3" class="product-card">
    <h3>Current account</h3>
    <p>Balance: 12,450.00 SEK</p>
  </div>

</body>
</html>
