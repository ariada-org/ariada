Fixture for rule: ariada/statement/page-link-from-footer
Detection condition (statement-page-exists.ts):
  selector: 'html' (fires once per page)
  check: document.querySelectorAll('a[href]') — any href matches CONVENTIONAL_PATHS
    /\/accessibility(-statement)?(\/|$|\?|#)/i
    /\/a11y(-statement)?(\/|$|\?|#)/i
    /\/tillganglighet(\/|$|\?|#)/i ... etc.
  returns false (fail) if no matching link found

This fixture has a fail-1 case (the html root without any statement link)
