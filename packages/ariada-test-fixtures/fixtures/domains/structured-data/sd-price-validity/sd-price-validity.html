<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sd-price-validity fixture</title>

  <!--
    fail-1: Product with an expired priceValidUntil date.
    checkOffer() calls isDateInPast() on "2020-01-01"; new Date("2020-01-01")
    is well before Date.now() so it returns true → critical sd-price-validity
    finding with message "... has passed".
    name, image, description, price and priceCurrency are all present so no
    sd-product-required findings come from this block.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Legacy Widget",
    "image": "https://example.com/legacy.jpg",
    "description": "A product whose price offer has expired.",
    "offers": {
      "@type": "Offer",
      "price": "29.00",
      "priceCurrency": "EUR",
      "priceValidUntil": "2020-01-01"
    }
  }
  </script>

  <!--
    fail-2: Product with priceValidUntil entirely absent from the offers object.
    checkOffer() tests priceValidUntil === undefined → critical sd-price-validity
    finding with message "missing a priceValidUntil date".
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Undated Offer Widget",
    "image": "https://example.com/undated.jpg",
    "description": "A product whose offer carries no expiry date.",
    "offers": {
      "@type": "Offer",
      "price": "19.00",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!--
    pass-1: Product with a priceValidUntil date far in the future.
    isDateInPast("2099-12-31") returns false → no sd-price-validity finding.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Long-Lived Widget",
    "image": "https://example.com/long.jpg",
    "description": "A product with a future-dated price offer.",
    "offers": {
      "@type": "Offer",
      "price": "59.00",
      "priceCurrency": "SEK",
      "priceValidUntil": "2099-12-31"
    }
  }
  </script>
</head>
<body>
  <main>
    <h1>sd-price-validity test page</h1>
    <p id="fail-1-area">Expired priceValidUntil (block 1).</p>
    <p id="fail-2-area">Absent priceValidUntil (block 2).</p>
    <p id="pass-1-area">Future priceValidUntil (block 3).</p>
  </main>
</body>
</html>
