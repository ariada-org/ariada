<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sd-article-required fixture</title>

  <!--
    fail-1: Article block missing the required "image" property and
    the required "author.name" field (author object has an empty name string).
    ruleArticleRequired checks ARTICLE_REQUIRED_FIELDS = ['headline','datePublished','image']
    plus a separate author.name check. headline and datePublished are present;
    image is absent → one serious finding. author.name trims to "" → a second
    serious finding for author.name.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "Accessibility compliance in 2026",
    "datePublished": "2026-06-01",
    "author": {
      "@type": "Person",
      "name": "   "
    }
  }
  </script>

  <!--
    fail-2: BlogPosting block where all three core fields are missing
    (headline, datePublished, image) and author is absent entirely.
    ARTICLE_TYPES includes 'BlogPosting'. Four serious findings expected:
    headline, datePublished, image, author-name.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "url": "https://example.com/post/1"
  }
  </script>

  <!--
    pass-1: NewsArticle block with all required fields populated and a named
    author. No findings expected.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "EAA enforcement begins across the EU",
    "datePublished": "2026-06-10",
    "image": "https://example.com/eaa-cover.jpg",
    "author": {
      "@type": "Person",
      "name": "Alexander Brichkin"
    }
  }
  </script>
</head>
<body>
  <article>
    <h1 id="fail-1-area">Accessibility compliance in 2026</h1>
    <p>Content for fail-1 article block.</p>
  </article>
  <article>
    <p id="fail-2-area">Content for fail-2 BlogPosting block.</p>
  </article>
  <article>
    <h1 id="pass-1-area">EAA enforcement begins across the EU</h1>
    <p>Content for pass-1 NewsArticle block.</p>
  </article>
</body>
</html>
