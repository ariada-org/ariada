<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sd-image-object-description fixture</title>

  <!--
    fail-1: ImageObject block with a contentUrl but no description property.
    ruleImageObjectDescription skips invalid blocks and non-ImageObject types,
    then checks hasProperty(block, 'description'). Missing → finding at moderate
    severity. The selector is img[src="..."] because contentUrl is present.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "contentUrl": "photo-product.jpg",
    "name": "Product photo"
  }
  </script>

  <!--
    fail-2: ImageObject with neither description nor contentUrl.
    Selector falls back to the nth-of-type script selector.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "name": "Hero banner"
  }
  </script>

  <!--
    pass-1: ImageObject that includes a non-empty description property.
    hasProperty returns true → no finding.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "contentUrl": "team-photo.jpg",
    "description": "The Agonist development team gathered around a whiteboard"
  }
  </script>
</head>
<body>
  <main>
    <h1>sd-image-object-description test page</h1>
    <img src="photo-product.jpg" alt="Product photo" id="fail-1-img" />
    <img src="hero.jpg" alt="Hero banner" id="fail-2-img" />
    <img src="team-photo.jpg" alt="The team" id="pass-1-img" />
  </main>
</body>
</html>
