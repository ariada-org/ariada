<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sd-parse-error fixture</title>

  <!--
    fail-1: JSON-LD block with a trailing comma — not valid JSON.
    The extractor locates this by regex over the HTML and passes the raw
    string to JSON.parse(), which throws, producing valid:false and a
    sd-parse-error finding at critical severity.
  -->
  <script id="fail-1" type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Broken site",
  }
  </script>

  <!--
    fail-2: JSON-LD block whose content is truncated mid-string.
    JSON.parse() throws; produces a second sd-parse-error finding.
  -->
  <script id="fail-2" type="application/ld+json">
  { "@context": "https://schema.org", "@type": "WebSite", "name": "Truncated
  </script>

  <!--
    pass-1: Syntactically valid JSON-LD — no sd-parse-error finding expected.
  -->
  <script id="pass-1" type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Valid site"
  }
  </script>
</head>
<body>
  <main>
    <h1>sd-parse-error test page</h1>
    <p>Two malformed JSON-LD blocks (fail-1, fail-2) and one valid block (pass-1).</p>
  </main>
</body>
</html>
