<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WSG 2.18 — Lazy Loading Fixture</title>
  <!--
    Rule under test: wsg-lazy-load (Web Sustainability Guidelines 2.18)
    Detection condition (sustainability.ts perElement):
      el.nodeName.toLowerCase() === 'img' AND el.attributes?.['loading'] is absent/falsy.

    fail-1: <img> with no loading attribute at all — triggers the rule.
    fail-2: <img loading="eager"> — explicit eager is equivalent to absent for this check
            (the code tests !loadingAttr, and 'eager' is a defined non-empty string,
             so this case does NOT trigger the rule per the code's exact condition.
             See note in expected.json).
    pass-1: <img loading="lazy"> — loading attribute present, no finding.
    pass-2: <img loading="eager"> — technically passes the code's !loadingAttr check
            because the attribute IS present (non-empty string). Included to clarify the
            code boundary: the code only checks attribute PRESENCE, not the value.
  -->
</head>
<body>
  <main>
    <h1>Lazy loading fixture</h1>

    <!--
      fail-1: img element with no loading attribute.
      The perElement extractor sets SUSTAIN_NO_LAZY_LOAD = true when
      el.attributes?.['loading'] is undefined/absent.
    -->
    <img id="fail-1"
         src="hero-photo.jpg"
         alt="A scenic coastal landscape used as a page hero"
         width="1200" height="600" />

    <!--
      fail-2: img element with no loading attribute and no src extension hint.
      Confirms the rule fires regardless of src value.
    -->
    <img id="fail-2"
         src="/images/product-shot"
         alt="Product photograph showing the device from the front"
         width="800" height="600" />

    <!--
      pass-1: img element with loading="lazy".
      el.attributes['loading'] === 'lazy' — truthy, so !loadingAttr is false.
      No finding generated.
    -->
    <img id="pass-1"
         src="thumbnail.webp"
         alt="A small thumbnail of the article author"
         loading="lazy"
         width="64" height="64" />

    <!--
      pass-2: img element with loading="eager".
      el.attributes['loading'] === 'eager' — truthy, so !loadingAttr is false.
      The code does not inspect the attribute value, only its presence.
      No finding generated.
    -->
    <img id="pass-2"
         src="above-fold-logo.png"
         alt="Site logo displayed above the fold"
         loading="eager"
         width="200" height="80" />
  </main>
</body>
</html>
