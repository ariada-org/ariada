<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WSG 2.14 — Image Format Fixture</title>
  <!--
    Rule under test: wsg-image-format (Web Sustainability Guidelines 2.14)
    Detection condition (sustainability.ts perDocument):
      For each entry in snap.networkResources:
        if mimeType.startsWith('image/') AND NOT (mimeType includes 'webp' OR 'avif')
        → increment unoptimizedImageCount.
      Finding fires when unoptimizedImageCount > 0.
      Severity: 'moderate'. Selector: ':root'.

    This rule is DOCUMENT-LEVEL and reads from PropertySnapshot.networkResources —
    not from the HTML DOM elements. The HTML markup represents what a page using
    unoptimised images looks like; the test harness must supply networkResources
    with the corresponding MIME type data for the finding to fire.

    fail-1 (document): harness provides networkResources with image/jpeg MIME type.
    pass-1 (document): harness provides networkResources with image/webp MIME type only.

    The HTML cases below represent the markup context of each scenario,
    wrapped in labelled sections so the harness can identify them.
  -->
</head>
<body>
  <main>
    <h1>Image format fixture</h1>

    <!--
      fail-1: Page context where images are served as JPEG (image/jpeg).
      The wsg-image-format finding fires at the :root level when the harness
      supplies networkResources: [{url, mimeType: 'image/jpeg', size: 45000}].
      HTML markup is included to make the page representative; the DOM element
      alone does NOT trigger the document-level finding.
    -->
    <section id="fail-1">
      <h2>Page with JPEG images (unoptimised format)</h2>
      <img src="product-photo.jpg"
           alt="A ceramic mug on a wooden desk"
           loading="lazy"
           width="800" height="600" />
      <img src="team-photo.jpg"
           alt="The product team gathered around a whiteboard"
           loading="lazy"
           width="1200" height="800" />
    </section>

    <!--
      pass-1: Page context where images are served as WebP (image/webp).
      The wsg-image-format finding does NOT fire when the harness supplies
      networkResources: [{url, mimeType: 'image/webp', size: 18000}].
      isNextGenFormat('image/webp') returns true, so unoptimizedImageCount stays 0.
    -->
    <section id="pass-1">
      <h2>Page with WebP images (next-gen format)</h2>
      <img src="product-photo.webp"
           alt="A ceramic mug on a wooden desk in WebP format"
           loading="lazy"
           width="800" height="600" />
      <img src="team-photo.avif"
           alt="The product team in AVIF format"
           loading="lazy"
           width="1200" height="800" />
    </section>
  </main>
</body>
</html>
