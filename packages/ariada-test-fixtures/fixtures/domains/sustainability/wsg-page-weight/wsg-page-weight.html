<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WSG 2.15 — Page Weight Fixture</title>
  <!--
    Rule under test: wsg-page-weight (Web Sustainability Guidelines 2.15)
    Detection condition (sustainability.ts perDocument + evaluate):
      totalBytes = sum of (resource.size ?? 0) across all networkResources.
      Finding fires when totalBytes > 1_500_000 (PAGE_WEIGHT_THRESHOLD_BYTES = 1.5 MB).
      Severity: 'serious'. Selector: ':root'.

    This rule is DOCUMENT-LEVEL and reads from PropertySnapshot.networkResources.
    The HTML markup alone cannot trigger it. The test harness must supply
    networkResources with the sizes that sum above or below the threshold.

    Threshold: 1,500,000 bytes (1.5 MB).

    fail-1: harness supplies networkResources totalling > 1,500,000 bytes.
    pass-1: harness supplies networkResources totalling <= 1,500,000 bytes.
  -->
</head>
<body>
  <main>
    <h1>Page weight fixture</h1>

    <!--
      fail-1: Page representing a heavy site (multiple large unoptimised images,
      large JavaScript bundles, web fonts). The networkResources the harness
      supplies must sum to more than 1,500,000 bytes.
      See harnessRequirement in expected.json.
    -->
    <section id="fail-1">
      <h2>Heavy page (over 1.5 MB threshold)</h2>
      <img src="hero-full-res.jpg"
           alt="Full-resolution hero photograph"
           width="2400" height="1200" />
      <img src="gallery-1.jpg" alt="Gallery photo 1" width="1200" height="800" />
      <img src="gallery-2.jpg" alt="Gallery photo 2" width="1200" height="800" />
      <script src="vendor-bundle.js"></script>
      <script src="app-bundle.js"></script>
    </section>

    <!--
      pass-1: Page representing a lightweight site. The networkResources the harness
      supplies must sum to no more than 1,500,000 bytes (strictly <=).
    -->
    <section id="pass-1">
      <h2>Lightweight page (under 1.5 MB threshold)</h2>
      <img src="hero-optimised.webp"
           alt="Optimised hero image in WebP format"
           loading="lazy"
           width="800" height="400" />
      <script src="app-slim.js" defer></script>
    </section>
  </main>
</body>
</html>
