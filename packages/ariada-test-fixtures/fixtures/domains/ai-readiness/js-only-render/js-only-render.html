<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>js-only-render fixture</title>
  <!--
    Detection logic (ai-readiness.ts detectJsOnlyRendering):
      1. bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i)
      2. bodyHtml = bodyMatch?.[1] ?? html
      3. text = bodyHtml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()
      4. return text.length < 50

    This fixture file contains MULTIPLE documents embedded as <template> elements
    to represent the fail and pass cases. Each template holds the body HTML that
    the test harness should use as the PropertySnapshot.html for that case.

    fail-1 body HTML: <div id="root"></div>
      After stripping tags: "" — empty → text.length = 0 < 50 → JS-only → RULE_JS_ONLY_RENDER

    fail-2 body HTML: <div id="app">Loading...</div>
      After stripping tags and collapsing whitespace: "Loading..." → length 10 < 50 → fires

    fail-3 body HTML: <noscript>Please enable JavaScript.</noscript>
      After stripping tags: "Please enable JavaScript." → length 26 < 50 → fires

    pass-1 body HTML: standard page with a heading and paragraph totalling 50+ characters.
      After stripping: text.length >= 50 → detectJsOnlyRendering returns false → no finding.
  -->
</head>
<body>
  <p>This outer page is the fixture host. The templates below contain the
  representative body HTML for each test case.</p>

  <!--
    fail-1: Classic React/Vue/Angular shell.
    The entire application body is a single empty mount point.
    After tag-stripping: "" → length 0 < 50 threshold → RULE_JS_ONLY_RENDER fires at "serious".
  -->
  <template id="fail-1">
    <body>
      <div id="root"></div>
    </body>
  </template>

  <!--
    fail-2: SPA shell with a loading indicator text.
    Body text after stripping: "Loading..." (10 chars) < 50 → RULE_JS_ONLY_RENDER fires.
    Even user-visible loading text is too short to indicate actual page content.
  -->
  <template id="fail-2">
    <body>
      <div id="app">Loading...</div>
    </body>
  </template>

  <!--
    fail-3: Server renders only a noscript fallback.
    Body text after stripping: "Please enable JavaScript." (25 chars) < 50 → fires.
    AI crawlers that do not execute JS see only this message, not the content.
  -->
  <template id="fail-3">
    <body>
      <noscript>Please enable JavaScript.</noscript>
    </body>
  </template>

  <!--
    pass-1: Server-rendered page with meaningful body content.
    Body text after stripping: "Web Accessibility Scanner Check your site now. Our
    scanner detects WCAG 2.2 and EAA issues." — well over 50 characters.
    detectJsOnlyRendering returns false → no RULE_JS_ONLY_RENDER finding.
  -->
  <template id="pass-1">
    <body>
      <header>
        <h1>Web Accessibility Scanner</h1>
        <nav><a href="/scan">Scan</a> <a href="/docs">Docs</a></nav>
      </header>
      <main>
        <p>Check your site now. Our scanner detects WCAG 2.2 and EAA issues automatically.</p>
      </main>
    </body>
  </template>
</body>
</html>
