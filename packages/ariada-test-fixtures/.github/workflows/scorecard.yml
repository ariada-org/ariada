# OpenSSF Scorecard supply-chain security audit for @ariada/test-fixtures.
#
# Documentation:
#   - https://github.com/ossf/scorecard
#   - https://github.com/ossf/scorecard-action
#
# Runs weekly + on push to main. Results uploaded as SARIF (Static Analysis
# Results Interchange Format) for the GitHub Security tab.
#
# Initially set publish_results to false; flip to true once a public
# scorecard.dev badge is desired.
#
# The workflow does not modify repository contents; it only reads the
# repository metadata and writes a results artifact + SARIF upload.

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          sarif_file: results.sarif
