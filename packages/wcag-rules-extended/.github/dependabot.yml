# Dependabot configuration for @ariada-org/wcag-rules-extended
#
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# We track:
#   - npm dependencies (axe-core peer dep, vitest, typescript, eslint, etc.)
#   - GitHub Actions used in workflows
#
# Cadence is weekly to keep noise low; security advisories are still
# raised immediately by Dependabot's security-update path regardless
# of this schedule.

version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(actions)'
      include: scope
