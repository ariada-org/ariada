# FOSSA configuration for @ariada-org/wcag-rules-extended
#
# Schema: https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
# Free tier: ≤25 contributing devs, ≤5 projects — fully under cap.
#
# Status: used by local CLI checks and the public FOSSA integration. Keep the
# required gate focused on the release-managed pnpm workspace.

version: 3

# Public FOSSA Free SaaS endpoint.
server: https://app.fossa.com

# API key intentionally NOT in this file. FOSSA reads $FOSSA_API_KEY from env
# when fossa-cli is run locally. The GitHub App integration uses repo-app auth
# and does not need a key on our side.

project:
  name: ariada-org/ariada
  id: github.com/ariada-org/ariada

# Do not pin a FOSSA team here. Team slugs are SaaS-account local, and an
# unknown team value fails analysis before dependency policy checks can run.

targets:
  only:
    # Gate the release-managed pnpm workspace first. Standalone prototype and
    # integration package-lock targets need owner-scoped dependency reviews.
    - type: pnpm
      path: ./

paths:
  exclude:
    - '**/node_modules/**'
    - '**/dist/**'
    - '**/coverage/**'
    - 'benchmarks/**'

# The explicit target keeps this external gate aligned with the public release
# queue while follow-up package owners align their standalone manifests.
