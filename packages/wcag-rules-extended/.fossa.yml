# FOSSA configuration for @ariada-org/wcag-rules-extended
#
# Schema: https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
# Free tier: ≤25 contributing devs, ≤5 projects — fully under cap.
#
# Status: local-only until the FOSSA GitHub App is installed on the public repo.
# After install, FOSSA auto-discovers package.json + lockfile and runs scans
# without needing fossa-cli locally.

version: 3

# Public FOSSA Free SaaS endpoint.
server: https://app.fossa.com

# API key intentionally NOT in this file. FOSSA reads $FOSSA_API_KEY from env
# when fossa-cli is run locally. The GitHub App integration uses repo-app auth
# and does not need a key on our side.

project:
  name: ariada-org/ariada
  id: github.com/ariada-org/ariada
  team: ariada-org

paths:
  exclude:
    - '**/node_modules/**'
    - '**/dist/**'
    - '**/coverage/**'
    - 'benchmarks/**'

# Default targets: FOSSA auto-discovers npm (package.json) and pnpm
# (pnpm-lock.yaml). No need to enumerate explicitly.
