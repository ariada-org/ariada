# SonarCloud (SonarQube Cloud) configuration for @ariada-org/wcag-rules-extended
#
# Schema: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters/
# Discipline: EU-region GitHub App variant MUST be installed (sonarcloud-eu),
# otherwise data residency is US. See signup-checklist sonarcloud.md.
#
# Status: local-only until the SonarCloud GitHub App is installed on the public
# repo and the organization `ariada-org` is imported.

sonar.organization=ariada-org
sonar.projectKey=ariada-org_wcag-rules-extended
sonar.projectName=@ariada-org/wcag-rules-extended
sonar.projectVersion=0.1.0

# Source + test paths. Monorepo: this file lives in packages/wcag-rules-extended/.
# When SonarCloud is configured with sonar.projectBaseDir at repo root, set
# `sonar.projectBaseDir=packages/wcag-rules-extended` in the workflow / UI.
# When auto-scan discovers this file in-place, the paths below are package-local.
sonar.sources=src
sonar.tests=src,test

# Test file detection — Vitest convention.
sonar.test.inclusions=**/*.test.ts,test/**/*.ts

# Exclusions — build output, vendored content, benchmark data.
sonar.exclusions=dist/**,coverage/**,benchmarks/**,node_modules/**,docs/session-logs/**

# Coverage report — Vitest with @vitest/coverage-v8 produces lcov.info here.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript-specific.
sonar.typescript.tsconfigPath=tsconfig.json

# Source encoding.
sonar.sourceEncoding=UTF-8

# SCM provider.
sonar.scm.provider=git

# Quality-gate policy. Use the "Sonar way" default at v0.1.0; tune later (Wave C).

# EU-region host. Sonar's EU app variant uses the same canonical hostname; the
# region is determined by which GitHub App is installed on the org (sonarcloud-eu
# vs sonarcloud), not by this property.
sonar.host.url=https://sonarcloud.io
