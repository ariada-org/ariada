# CodeRabbit configuration for @ariada-org/wcag-rules-extended
#
# Schema: https://docs.coderabbit.ai/reference/yaml-template
# Discipline: tone is precise + technical; no marketing buzz; reviews must catch
# unused imports + enforce conventional commits in PR titles.
#
# Status: local-only until the CodeRabbit GitHub App is installed on the public
# repo (free Pro tier requires public visibility).

# Review language. Matches package README + docs.
language: en-US

# Tone profile. "chill" is non-pedantic; alternatives are "assertive" + "concise".
# Picked "chill" because we want signal over noise.
reviews:
  profile: chill

  # Set a PR check status that reflects review outcome.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  commit_status: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main

  # Paths to ignore — build output + vendored content + non-source noise.
  path_filters:
    - '!dist/**'
    - '!coverage/**'
    - '!node_modules/**'
    - '!benchmarks/**/results/**'

  # Per-area review instructions. Each entry is a glob + a directive to
  # CodeRabbit; keeps the AI focused on what matters for that area.
  path_instructions:
    - path: 'src/rules/**/*.ts'
      instructions: |
        Every rule MUST cite its WCAG 2.2 Success Criterion (e.g. "WCAG 2.2 1.3.1")
        AND its EN 301 549 v3.2.1 clause (e.g. "EN 301 549 9.1.3.1") in the rule
        metadata.help or metadata.helpUrl. Flag any new rule lacking both citations.
        Test fixtures MUST include at least one positive case and one negative case.
    - path: 'src/evidence/**/*.ts'
      instructions: |
        Evidence emitters (VPAT, EN 301 549, DOS-lagen) MUST produce deterministic
        output for fixed input. Flag any use of Date.now() / crypto.randomUUID()
        outside an injected clock/uuid dependency.
    - path: 'src/statement/**/*.ts'
      instructions: |
        Accessibility-statement generator MUST escape all user-controlled strings
        before insertion into HTML. Flag any string concatenation into HTML
        without `escapeHtml(...)`.
    - path: '**/*.test.ts'
      instructions: |
        Use Vitest patterns (describe + it + expect, vi.mock for mocks).
        DO NOT use Jest patterns (jest.mock). Flag any drift.
        Snapshots must live in __snapshots__/ adjacent to the test.
    - path: 'package.json'
      instructions: |
        Watch for accidental addition of `dependencies` — this package MUST keep
        runtime `dependencies: {}` (axe-core is peerDependencies only).
        New devDependencies are fine; flag any new production dependency.
    - path: '**/*.md'
      instructions: |
        Documentation tone: precise + technical. Avoid marketing phrases
        ("blazing fast", "revolutionary", "best-in-class"). Flag if present.

  # Tools CodeRabbit consults beyond its base LLM.
  tools:
    biome:
      enabled: false # We use ESLint not Biome.
    eslint:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: true
      level: default
    gitleaks:
      enabled: true # Secrets scanning.
    yamllint:
      enabled: true

# PR title gate. Conventional Commits subjects, lowercase scope.
# Format: `<type>(<scope>): <subject>` — e.g. `feat(rules): add WCAG 2.4.11`.
# Per founder direction: PR title MUST follow this format.
chat:
  auto_reply: true
  art: false

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
