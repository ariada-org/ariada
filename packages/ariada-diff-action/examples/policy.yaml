# Example BaselinePolicy for the differential accessibility CI gate.
# Copy to .ariada/policy.yaml at the root of your repository and adjust
# to your team's risk tolerance.
version: '1.0'

# Gate-wide settings independent of severity/classification/path rules.
gate:
  # balanced (default): findings the underlying scanner could only mark as
  # "needs manual review" (rather than a definite violation) are downgraded
  # to a warning, so they never block a merge on their own. Definite
  # violations are still gated by severity threshold below.
  #
  # strict: needs-manual-review findings are gated exactly like definite
  # violations — use this once your team has capacity to triage every
  # candidate the scanner raises.
  profile: balanced

defaults:
  new:
    critical: { action: fail }
    serious: { action: fail }
    moderate: { action: warn }
    minor: { action: warn }
  pre_existing:
    critical: { action: warn }
    serious: { action: warn }
    moderate: { action: info }
    minor: { action: info }
  resolved:
    any: { action: info, celebrate: true }

warn_only: false
