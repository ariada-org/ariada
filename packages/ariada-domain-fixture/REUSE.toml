# inline SPDX header.

# Source — EUPL-1.2 (same as the rest of the scanner work).
[[annotations]]
path = ["src/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "EUPL-1.2"

# Build / tooling config — CC0-1.0 (config-as-data, no attribution friction).
[[annotations]]
path = ["package.json", "tsconfig.json", "tsconfig.*.json", "vitest.config.ts", "REUSE.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Agonist Development AB"
SPDX-License-Identifier = "CC0-1.0"
