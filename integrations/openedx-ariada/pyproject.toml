[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-ariada"
version = "0.1.0"
description = "Staff-facing Ariada accessibility reports for rendered Open edX course pages"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
  { name = "Alexander Brichkin (Agonist Development AB)", email = "git@ariada.org" },
]
keywords = ["accessibility", "ariada", "open-edx", "tutor", "wcag", "xblock"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "XBlock>=5.3,<7",
  "WebOb>=1.8,<2",
  "web-fragments>=2.2,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
tutor = ["tutor>=21,<22"]

[project.entry-points."xblock.v1"]
ariada = "openedx_ariada.xblock:AriadaXBlock"

[project.entry-points."tutor.plugin.v1"]
openedx-ariada = "openedx_ariada.tutor"

[project.urls]
Homepage = "https://ariada.org"
Documentation = "https://ariada.org"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openedx_ariada = [
  "py.typed",
  "runtime/*.tgz",
  "static/*.css",
  "static/*.js",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false
