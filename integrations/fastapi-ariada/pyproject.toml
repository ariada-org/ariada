[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariada-fastapi"
version = "0.1.0"
description = "FastAPI middleware adapter for the Ariada accessibility scanner CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "EUPL-1.2"
authors = [
  { name = "Alexander Brichkin (Agonist Development AB)", email = "git@ariada.org" }
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28"
]
keywords = ["accessibility", "fastapi", "starlette", "wcag", "eaa", "ariada"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "ruff>=0.8"
]

[tool.setuptools.packages.find]
include = ["ariada_fastapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
