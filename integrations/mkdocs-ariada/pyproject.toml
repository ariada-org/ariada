[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-ariada"
version = "0.1.0"
description = "MkDocs plugin that scans generated site HTML with the shared Ariada CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "EUPL-1.2"
authors = [{ name = "Alexander Brichkin (Agonist Development AB)", email = "git@ariada.org" }]
dependencies = ["mkdocs>=1.6,<2"]
keywords = ["accessibility", "a11y", "mkdocs", "documentation", "wcag", "ariada"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "ruff>=0.8"]

[project.entry-points."mkdocs.plugins"]
ariada = "mkdocs_ariada.plugin:AriadaMkDocsPlugin"

[tool.setuptools.packages.find]
include = ["mkdocs_ariada*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
