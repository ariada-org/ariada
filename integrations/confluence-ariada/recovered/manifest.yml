modules:
  confluence:contentAction:
    - key: ariada-page-scan
      title: Scan accessibility with Ariada
      resource: ariada-panel
      resolver:
        endpoint: ariada-scanner
      viewportSize: large
  endpoint:
    - key: ariada-scanner
      remote: ariada-runtime
      auth:
        appUserToken:
          enabled: true
        appSystemToken:
          enabled: false
resources:
  - key: ariada-panel
    path: static/app
remotes:
  - key: ariada-runtime
    baseUrl: "${ARIADA_REMOTE_URL}"
    operations:
      - compute
permissions:
  scopes:
    - read:page:confluence
    - read:app-user-token
app:
  id: "ari:cloud:ecosystem::app/${FORGE_APP_ID}"
  runtime:
    name: nodejs22.x
environment:
  variables:
    - key: FORGE_APP_ID
      default: "00000000-0000-4000-8000-000000000222"
    - key: ARIADA_REMOTE_URL
      default: "https://confluence-scanner.invalid"
