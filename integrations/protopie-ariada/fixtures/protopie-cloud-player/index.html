<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProtoPie player fixture</title>
  </head>
  <body>
    <!--
      Stands in for the page ProtoPie Cloud serves a prototype on. It is served
      over a local port and handed to the scanner, so what matters is that it
      exists and answers; the prototype itself is a canvas the player fills in,
      which is why there is nothing here to scan but the frame around it.
    -->
    <main>
      <h1>Ariada kiosk</h1>
      <div id="prototype-player" role="application" aria-label="Prototype player"></div>
    </main>
  </body>
