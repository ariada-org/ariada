[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterlab-ariada"
version = "0.1.0"
description = "JupyterLab bridge that scans rendered notebook HTML with the shared Ariada CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "EUPL-1.2"
authors = [{ name = "Alexander Brichkin (Agonist Development AB)", email = "git@ariada.org" }]
dependencies = [
  "jupyter-server>=2",
  "nbconvert>=7",
  "nbformat>=5",
]
keywords = ["accessibility", "a11y", "jupyterlab", "notebook", "wcag", "ariada"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "ruff>=0.8"]

[project.scripts]
jupyterlab-ariada = "jupyterlab_ariada.cli:main"

[tool.setuptools.packages.find]
include = ["jupyterlab_ariada*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
