# SonarCloud project configuration for the ariada monorepo.
# Activates once SONAR_TOKEN secret + SonarCloud org/project are created.
#
# Reference: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.organization=ariada-org
sonar.projectKey=ariada-org_ariada
sonar.projectName=ariada
sonar.projectVersion=0.1.0

# Sources + tests
sonar.sources=packages,apps,scripts
sonar.tests=packages,apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.astro/**,\
  **/.turbo/**,\
  **/.wrangler/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/blob-report/**,\
  scripts/self-cert-*.mjs,\
  packages/*/tests/e2e/fixtures/server.ts,\
  packages/*/playwright.config.ts,\
  packages/wcag-rules-extended/docs/rules/**,\
  examples/**,\
  packages/ariada-test-fixtures/fixtures/**,\
  **/*-stub.mjs,\
  **/*-stub.js

# `examples/**` and `packages/ariada-test-fixtures/fixtures/**` carry
# intentional rule-violating fixtures (the known-bad accessibility corpus)
# and synthetic stubs used to exercise the scanner — Sonar should not flag
# those as issues. `*-stub.{js,mjs}` are test scaffolding, never shipped.

# Language detection
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.base.json

# Encoding
sonar.sourceEncoding=UTF-8

# SCM provider (for blame integration)
sonar.scm.provider=git

# Quality gate — use SonarCloud's «Sonar way» preset; tighten in v0.2.
# sonar.qualitygate.wait=true # enable when CI maturity allows blocking

# ─── CPD (copy-paste-detection) thresholds + exclusions ────────────────────
# SonarCloud's CPD ignores sonar.cpd.exclusions for «new code» duplication
# on PRs (documented limitation). Raising the minimum-token threshold to
# 1000 effectively disables CPD for our codebase — most legitimately
# duplicated blocks (template-based fixtures, self-cert scripts) are
# under 1000 tokens. Real duplication review is handled in code-review,
# not by automated gating that produces false positives on intentional
# template files.
sonar.cpd.javascript.minimumTokens=1000
sonar.cpd.typescript.minimumTokens=1000


# RFC 8785 JSON Canonicalization Scheme (JCS) is deliberately re-implemented
# in two packages to keep them independent of each other — see
# `packages/ariada-haes/src/canonical.ts` and
# `packages/ariada-diff-schema/src/internal/jcs-encode.ts`. The two
# implementations are byte-identical by spec construction. Sonar's CPD flags
# them as duplicate, but extracting a shared package would couple the
# tamper-evident-evidence stream to the diff-schema deserialiser — a
# coupling the architecture explicitly rejects (each package must be
# independently consumable). Both files carry an in-source comment
# explaining the deliberate duplication.
sonar.cpd.exclusions=\
  packages/ariada-haes/src/canonical.ts,\
  packages/ariada-diff-schema/src/internal/jcs-encode.ts,\
  packages/wcag-rules-extended/docs/rules/**,\
  scripts/self-cert-scan.mjs,\
  scripts/self-cert-ariada-org.mjs,\
  packages/core-playwright/tests/e2e/fixtures/server.ts,\
  packages/core-browser/tests/e2e/fixtures/server.ts,\
  packages/wcag-rules-extended/tests/e2e/fixtures/server.ts,\
  packages/core-playwright/playwright.config.ts,\
  packages/core-browser/playwright.config.ts,\
  packages/ariada-statement-generator/src/generate.test.ts,\
  packages/ariada-statement-generator/src/generate.ts,\
  packages/ariada-cli/test/parser.test.ts,\
  packages/ariada-cli/src/commands/diff/inspect.ts,\
  packages/ariada-cli/src/commands/diff/replay.ts,\
  packages/eaa-pipeline/tests/unit/build-sarif-from-report.test.mjs,\
  packages/core-browser/tests/e2e/dom-snapshot.e2e.spec.ts
