# SonarCloud project configuration for the ariada monorepo.
# Reference: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.organization=ariada-org
sonar.projectKey=ariada-org_ariada
sonar.projectName=ariada
sonar.projectVersion=0.1.0

# Sources + tests
sonar.sources=packages,apps,scripts
sonar.tests=packages,apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding + SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Language detection
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.base.json

# Quality gate — use SonarCloud's «Sonar way» preset.
# sonar.qualitygate.wait=true # enable when CI maturity allows blocking

# ── Path exclusions ────────────────────────────────────────────────
# Skip generated, build, vendored, and intentionally-rule-violating
# fixtures. Test fixtures are deliberately minimal HTML / server
# scaffolding for end-to-end smoke runs; not production code.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.astro/**,\
  **/.turbo/**,\
  **/.wrangler/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/blob-report/**,\
  scripts/self-cert-*.mjs,\
  packages/*/tests/e2e/fixtures/**,\
  packages/*/playwright.config.ts,\
  packages/wcag-rules-extended/docs/rules/**,\
  examples/**

# ── Copy-Paste Detection knobs ────────────────────────────────────
# Raise the minimum-token threshold so legitimate template duplication
# (per-package NOTICE blocks, scope-rename diff in package.json files,
# fixture-based test scaffolding) does not produce false positives.
# Real duplication review happens in code-review, not by automated
# gating that flags intentional template files.
sonar.cpd.javascript.minimumTokens=1000
sonar.cpd.typescript.minimumTokens=1000

# Per-file CPD exclusions — files whose content is byte-identical by
# spec construction (RFC 8785 JSON Canonicalization Scheme is deliberately
# duplicated across packages to keep them independent), plus generated
# files where duplication is structurally inevitable.
sonar.cpd.exclusions=\
  **/pnpm-lock.yaml,\
  **/package-lock.json,\
  **/NOTICE,\
  **/CHANGELOG.md,\
  packages/ariada-haes/src/canonical.ts,\
  packages/ariada-diff-schema/src/internal/jcs-encode.ts,\
  packages/wcag-rules-extended/docs/rules/**,\
  scripts/self-cert-scan.mjs,\
  scripts/self-cert-ariada-org.mjs,\
  packages/ariada-statement-generator/src/generate.test.ts,\
  packages/ariada-statement-generator/src/generate.ts,\
  packages/ariada-cli/test/parser.test.ts,\
  packages/ariada-cli/src/commands/diff/inspect.ts,\
  packages/ariada-cli/src/commands/diff/replay.ts,\
  packages/eaa-pipeline/tests/unit/build-sarif-from-report.test.mjs,\
  packages/core-browser/tests/e2e/dom-snapshot.e2e.spec.ts
