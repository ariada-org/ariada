#
# SonarCloud — code-quality + security analysis (bugs, vulnerabilities,
# code smells, hotspots, coverage). Free for public OSS repos via
# SonarCloud's OSS plan. Activates when SONAR_TOKEN is added to GitHub
# Secrets + the SonarCloud project + organization are created via
# sonarcloud.io (see setup memo).
#
# Reference: https://docs.sonarsource.com/sonarcloud/getting-started/github/
# Pinned actions per supply-chain discipline.
#
# Requires SONAR_TOKEN secret (set in GitHub repository secrets).

name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: read-all

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-22.04
    if: ${{ vars.ENABLE_SONARCLOUD == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # SonarCloud needs full git history for accurate blame/coverage
          # attribution; fetch-depth 0 = unshallow clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm turbo run test -- --coverage
        continue-on-error: true # don't block scan on test failures

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97 # v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
