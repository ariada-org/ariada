#
# Release workflow — Changesets-driven version + publish.
#
# Authenticates to npm with a token (NODE_AUTH_TOKEN). Provenance is emitted
# through the OIDC id-token throughout.
#
# The token is the standing mechanism, not a temporary one. A trusted publisher
# can only be registered against a package that already exists on the registry,
# so each package's first publish needs a token — and there are seventy-one
# publishable packages against eight on the registry. A plan that ends with
# sixty-three visits to a web form to register publishers one at a time does
# not get finished; the first attempt at it expired in a week having published
# nothing. So the token stays, and is contained instead:
#
#   * granular rather than classic, so its reach is described rather than
#     total;
#   * no IP allowlist, because runner addresses move and a stale list would
#     silently break releases;
#   * an expiry — 2026-10-31 for the current one — with a reminder well before
#     it. The previous token lapsed unnoticed and releases simply stopped.
#
# It is wider than publishing strictly needs: two scopes, and organisation
# read-write on both. Organisation permission governs members and settings, not
# packages, so a leak would cost more than a bad publish. That was weighed and
# accepted on 2026-08-02 rather than overlooked, and narrowing it is a reissue
# whenever convenient — not a migration, and nothing depends on it staying
# wide.
#
# Trusted publishers are still worth registering for the few packages that
# release often — they remove the token from that path entirely. They are an
# improvement per package, not a precondition for releasing at all.
#
# This arrangement has a deadline, though, and it is npm's rather than ours:
# tokens that bypass two-factor authentication are being restricted, account
# changes from August 2026 and direct publishing from January 2027. So the
# token buys time, not permanence. Before that date the frequently-released
# packages need trusted publishers registered, and the rest need a decision
# rather than a surprise.
#
# Reference:
#   - https://docs.npmjs.com/trusted-publishers
#   - https://github.com/changesets/action
#
# Setup:
#   1. Store the granular token as the repository secret NPM_TOKEN.
#   2. Each package's package.json must have `publishConfig.access: "public"`
#      and `repository.url` matching the GitHub remote.
#   3. Sigstore provenance attestations are emitted automatically by
#      `pnpm publish --provenance` when running under GitHub Actions OIDC.
#   4. Optionally, for a package that releases frequently, add a trusted
#      publisher on npmjs.com (Settings → Publishing) with publisher = GitHub
#      Actions, organization = ariada-org, repository = ariada, workflow
#      filename = release.yml.
#
# The workflow is started by hand and never by a push. Publishing is a decision
# about what the world receives, and a commit landing is not that decision — tying
# one to the other would turn every merge into a version nobody chose to cut.

name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ariada-org'
    permissions:
      contents: write # Create version-bump commits + tags
      pull-requests: write # Open the "Version Packages" PR
      id-token: write # OIDC for npm trusted publisher + Sigstore provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.15.0'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm
          # registry-url must be present for npm publish to find the
          # Trusted Publisher OIDC endpoint.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

      # Some suites drive a browser from `test`, not only from `test:e2e` — the
      # accessibility demo among them. Without this the browser is missing and
      # every release fails at the test step, which is indistinguishable from a
      # release that had nothing to do. The build workflow learned this already;
      # the step is the same one.
      - name: Playwright browsers
        run: pnpm --filter "@ariada-org/core-playwright" exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm turbo run test

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # `pnpm changeset publish` emits each package with --provenance
          # automatically under GitHub Actions OIDC.
          # `pnpm release` -> `changeset publish` (defined in root package.json)
          # `pnpm version` -> `changeset version` (defined in root package.json)
          publish: pnpm release
          version: pnpm version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Granular token scoped to @ariada-org. Needed because a trusted
          # publisher cannot be registered against a package that does not yet
          # exist, and most of these do not. Provenance still comes from the
          # OIDC id-token granted above, so what is published is attested to
          # this workflow regardless of how it authenticated.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
