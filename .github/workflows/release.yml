#
# Release workflow — Changesets-driven version + publish.
#
# Authenticates to npm with a token (NODE_AUTH_TOKEN) for the bootstrap
# publish, because a Trusted Publisher can only be registered against a
# package that already exists on the registry. Provenance is emitted via
# the OIDC id-token throughout. Once every package exists on the registry,
# register the per-package Trusted Publisher and drop the token.
# Reference:
#   - https://docs.npmjs.com/trusted-publishers
#   - https://github.com/changesets/action
#
# Setup (one-time, before activation):
#   1. Configure trusted publisher on npmjs.com for each @ariada-org/* package:
#      Settings → Publishing → Add trusted publisher
#         publisher = GitHub Actions
#         organization or user = ariada-org
#         repository = ariada
#         workflow filename = release.yml
#         environment = (leave blank or "release" if using env protection)
#   2. Each package's package.json must have `publishConfig.access: "public"`
#      and `repository.url` matching the GitHub remote.
#   3. Sigstore provenance attestations are emitted automatically by
#      `pnpm publish --provenance` when running under GitHub Actions OIDC.
#
# Keep this workflow manual until npm trusted publishing is configured
# for the @ariada-org packages. Push-triggered drip commits must not
# attempt first-time package publication.

name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ariada-org'
    permissions:
      contents: write # Create version-bump commits + tags
      pull-requests: write # Open the "Version Packages" PR
      id-token: write # OIDC for npm trusted publisher + Sigstore provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'
          cache: pnpm
          # registry-url must be present for npm publish to find the
          # Trusted Publisher OIDC endpoint.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

      - name: Run tests
        run: pnpm turbo run test

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          # `pnpm changeset publish` emits each package with --provenance
          # automatically under GitHub Actions OIDC.
          # `pnpm release` -> `changeset publish` (defined in root package.json)
          # `pnpm version` -> `changeset version` (defined in root package.json)
          publish: pnpm release
          version: pnpm version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap auth for the first publish of each package — a trusted
          # publisher can only be registered against a package that already
          # exists on the registry, so the very first publish needs a token.
          # Provenance is still emitted via the OIDC id-token granted above.
          # Once every package exists on the registry, register the GitHub
          # Actions trusted publisher per package and drop this token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
