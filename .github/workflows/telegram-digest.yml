#
# Telegram daily digest — ONE message per day to founder DM + group, replacing
# per-commit / per-workflow notification spam with a single 24h summary.
# ----------------------------------------------------------------------------
# Trigger: scheduled cron at 07:07 UTC = 09:07 Stockholm (CEST summer / CET
# winter). Off-the-hour `:07` per CronCreate convention to avoid the cron
# stampede on whole-hour boundaries and reduce the chance of GitHub queueing
# the job mid-quota-window.
#
# Payload format:
#   - Single Telegram HTML message.
#   - Encoding: raw UTF-8 + curl `--data-urlencode`. NEVER use
#     `python -c "json.dumps(...)"` without `ensure_ascii=False`
#     (default is True -> `\uXXXX` literals on Telegram).
#
# Delivery order (per notification-protocol §«Order: DM first, group second»):
#   1. DM to founder chat ID 71182873.
#   2. Group chat ID -1003562949842.
#
# Secrets required (founder action — flag in PR description):
#   - TELEGRAM_BOT_TOKEN  — read from repo secret. Bot must be a member of
#                            the group chat AND have started a DM with the
#                            founder (Telegram requires bot-initiated chat
#                            permission before /sendMessage works).
#
# Failure mode (graceful):
#   - If TELEGRAM_BOT_TOKEN missing, write a $GITHUB_STEP_SUMMARY warning and
#     succeed the job (don't fail — secret rotation shouldn't redden the
#     digest).
#   - If sendMessage HTTP fails, retry once then warn-and-succeed.

name: telegram-digest

on:
  schedule:
    # 07:07 UTC daily = 09:07 Stockholm (CEST) / 08:07 Stockholm (CET).
    # Off-the-hour :07 avoids cron stampede at hour boundaries.
    - cron: '7 7 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Build + send 24h Telegram digest
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      DM_CHAT_ID: '71182873'
      GROUP_CHAT_ID: '-1003562949842'
    steps:
      - name: Checkout (sparse — only need package.json + scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute time window (last 24h)
        id: window
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '24 hours ago' +'%Y-%m-%dT%H:%M:%SZ')
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          TODAY=$(date -u +'%Y-%m-%d')
          {
            echo "since=${SINCE}"
            echo "now=${NOW}"
            echo "today=${TODAY}"
          } >> "$GITHUB_OUTPUT"

      - name: Aggregate 24h activity
        id: aggregate
        env:
          SINCE: ${{ steps.window.outputs.since }}
          NOW: ${{ steps.window.outputs.now }}
        run: |
          set -euo pipefail

          # PRs merged in last 24h
          PRS_MERGED=$(gh api -X GET "repos/${OWNER}/${REPO}/pulls" \
            -f state=closed -f sort=updated -f direction=desc -f per_page=100 \
            --jq "[.[] | select(.merged_at != null and .merged_at >= \"${SINCE}\")] | length" 2>/dev/null || echo 0)

          # PRs currently open
          PRS_OPEN=$(gh api -X GET "repos/${OWNER}/${REPO}/pulls" \
            -f state=open -f per_page=100 \
            --jq "length" 2>/dev/null || echo 0)

          # Workflow runs in window — bucket by conclusion
          RUNS_JSON=$(gh api -X GET "repos/${OWNER}/${REPO}/actions/runs" \
            -f created=">${SINCE}" -f per_page=100 \
            --jq "[.workflow_runs[] | {name, conclusion, status, head_sha, html_url}]" 2>/dev/null || echo '[]')

          RUNS_FAILED=$(echo "$RUNS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          RUNS_SUCCESS=$(echo "$RUNS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')

          # Specific scanner failures (Snyk / SonarCloud / Semgrep / CodeQL)
          SNYK_FAILS=$(echo "$RUNS_JSON" | jq '[.[] | select(.name == "Snyk" and .conclusion == "failure")] | length')
          SONAR_FAILS=$(echo "$RUNS_JSON" | jq '[.[] | select(.name == "SonarCloud" and .conclusion == "failure")] | length')
          SEMGREP_FAILS=$(echo "$RUNS_JSON" | jq '[.[] | select(.name == "Semgrep" and .conclusion == "failure")] | length')
          CODEQL_FAILS=$(echo "$RUNS_JSON" | jq '[.[] | select(.name == "CodeQL" and .conclusion == "failure")] | length')

          # Top-2 commits by recency (subject only — no body)
          COMMITS_JSON=$(gh api -X GET "repos/${OWNER}/${REPO}/commits" \
            -f since="${SINCE}" -f per_page=2 \
            --jq "[.[] | {sha: .sha[0:7], msg: (.commit.message | split(\"\n\") | .[0])}]" 2>/dev/null || echo '[]')

          # Latest tag (name + age in hours)
          LATEST_TAG=$(gh api -X GET "repos/${OWNER}/${REPO}/tags" -f per_page=1 \
            --jq ".[0].name // \"none\"" 2>/dev/null || echo "none")
          if [ "$LATEST_TAG" != "none" ]; then
            TAG_SHA=$(gh api -X GET "repos/${OWNER}/${REPO}/tags" -f per_page=1 \
              --jq ".[0].commit.sha" 2>/dev/null || echo "")
            if [ -n "$TAG_SHA" ]; then
              TAG_DATE=$(gh api "repos/${OWNER}/${REPO}/commits/${TAG_SHA}" \
                --jq ".commit.committer.date" 2>/dev/null || echo "")
            fi
          fi
          TAG_AGE="${TAG_DATE:-unknown}"

          # New issues (CVE / Dependabot proxy — looks for "vuln" / "CVE" / "Dependabot" in title)
          NEW_CVES=$(gh api -X GET "repos/${OWNER}/${REPO}/issues" \
            -f since="${SINCE}" -f state=open -f per_page=100 \
            --jq "[.[] | select(.pull_request == null and (.title | test(\"CVE|vuln|security\"; \"i\")))] | length" 2>/dev/null || echo 0)

          # CodeRabbit reviews count (bot comments authored by coderabbitai in window)
          CR_REVIEWS=$(gh api -X GET "repos/${OWNER}/${REPO}/pulls/comments" \
            -f since="${SINCE}" -f per_page=100 \
            --jq "[.[] | select(.user.login == \"coderabbitai[bot]\" or .user.login == \"coderabbitai\")] | length" 2>/dev/null || echo 0)

          # Pass to next step via env file (multi-line JSON for commits)
          {
            echo "prs_merged=${PRS_MERGED}"
            echo "prs_open=${PRS_OPEN}"
            echo "runs_failed=${RUNS_FAILED}"
            echo "runs_success=${RUNS_SUCCESS}"
            echo "snyk_fails=${SNYK_FAILS}"
            echo "sonar_fails=${SONAR_FAILS}"
            echo "semgrep_fails=${SEMGREP_FAILS}"
            echo "codeql_fails=${CODEQL_FAILS}"
            echo "latest_tag=${LATEST_TAG}"
            echo "tag_age=${TAG_AGE}"
            echo "new_cves=${NEW_CVES}"
            echo "cr_reviews=${CR_REVIEWS}"
            echo "commits_json<<COMMITS_EOF"
            echo "${COMMITS_JSON}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build digest message
        id: msg
        env:
          TODAY: ${{ steps.window.outputs.today }}
          PRS_MERGED: ${{ steps.aggregate.outputs.prs_merged }}
          PRS_OPEN: ${{ steps.aggregate.outputs.prs_open }}
          RUNS_FAILED: ${{ steps.aggregate.outputs.runs_failed }}
          RUNS_SUCCESS: ${{ steps.aggregate.outputs.runs_success }}
          SNYK_FAILS: ${{ steps.aggregate.outputs.snyk_fails }}
          SONAR_FAILS: ${{ steps.aggregate.outputs.sonar_fails }}
          SEMGREP_FAILS: ${{ steps.aggregate.outputs.semgrep_fails }}
          CODEQL_FAILS: ${{ steps.aggregate.outputs.codeql_fails }}
          LATEST_TAG: ${{ steps.aggregate.outputs.latest_tag }}
          TAG_AGE: ${{ steps.aggregate.outputs.tag_age }}
          NEW_CVES: ${{ steps.aggregate.outputs.new_cves }}
          CR_REVIEWS: ${{ steps.aggregate.outputs.cr_reviews }}
          COMMITS_JSON: ${{ steps.aggregate.outputs.commits_json }}
        run: |
          set -euo pipefail

          # Build top-2 commits lines.
          COMMITS_BLOCK=$(echo "${COMMITS_JSON}" | jq -r '
            map("• <code>\(.sha)</code> \(.msg | gsub("<"; "&lt;") | gsub(">"; "&gt;") | .[0:80])") | .[]
          ' | head -2 | sed ':a;N;$!ba;s/\n/\\n/g')

          if [ -z "${COMMITS_BLOCK}" ]; then
            COMMITS_BLOCK="• (no commits in window)"
          fi

          # Snyk regression line (only if >0)
          SNYK_LINE=""
          if [ "${SNYK_FAILS}" -gt 0 ]; then
            SNYK_LINE="⚠ Snyk regression: ${SNYK_FAILS} failed run(s)\\n"
          fi
          SONAR_LINE=""
          if [ "${SONAR_FAILS}" -gt 0 ]; then
            SONAR_LINE="❌ SonarCloud gate fail × ${SONAR_FAILS} — awaiting fix\\n"
          fi
          SEMGREP_LINE=""
          if [ "${SEMGREP_FAILS}" -gt 0 ]; then
            SEMGREP_LINE="⚠ Semgrep findings: ${SEMGREP_FAILS} run(s)\\n"
          fi
          CODEQL_LINE=""
          if [ "${CODEQL_FAILS}" -gt 0 ]; then
            CODEQL_LINE="❌ CodeQL: ${CODEQL_FAILS} failed run(s)\\n"
          fi

          # Tag age display
          TAG_DISPLAY="${LATEST_TAG}"
          if [ "${LATEST_TAG}" != "none" ] && [ "${TAG_AGE}" != "unknown" ]; then
            TAG_DISPLAY="${LATEST_TAG} (${TAG_AGE})"
          fi

          # Assemble HTML body. Use $'...' for literal newline interpretation
          # OR write to file to avoid shell-escape pitfalls with Cyrillic.
          MSG_FILE="$(mktemp)"
          {
            printf '<b>%s/%s — 24h digest (%s)</b>\n' "${OWNER}" "${REPO}" "${TODAY}"
            printf '\n'
            printf '✅ %s PRs merged · %s open\n' "${PRS_MERGED}" "${PRS_OPEN}"
            printf '🔁 CI runs: %s success · %s failed\n' "${RUNS_SUCCESS}" "${RUNS_FAILED}"
            [ -n "${SNYK_LINE}" ]    && printf '%s' "$(printf '%b' "${SNYK_LINE}")"
            [ -n "${SONAR_LINE}" ]   && printf '%s' "$(printf '%b' "${SONAR_LINE}")"
            [ -n "${SEMGREP_LINE}" ] && printf '%s' "$(printf '%b' "${SEMGREP_LINE}")"
            [ -n "${CODEQL_LINE}" ]  && printf '%s' "$(printf '%b' "${CODEQL_LINE}")"
            printf '🔒 %s new CVE/security issues\n' "${NEW_CVES}"
            printf '🏷 Latest tag: <code>%s</code>\n' "${TAG_DISPLAY}"
            printf '🤖 CodeRabbit: %s review comment(s)\n' "${CR_REVIEWS}"
            printf '\n'
            printf '<b>Top commits:</b>\n'
            printf '%b\n' "${COMMITS_BLOCK}"
          } > "${MSG_FILE}"

          # Persist file path for next step.
          echo "msg_file=${MSG_FILE}" >> "$GITHUB_OUTPUT"

          # Also dump to step summary (audit trail).
          {
            echo "## Telegram digest body"
            echo ''
            echo '```'
            cat "${MSG_FILE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram DM + group
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MSG_FILE: ${{ steps.msg.outputs.msg_file }}
        run: |
          set -uo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            {
              echo '## ⚠ TELEGRAM_BOT_TOKEN missing'
              echo ''
              echo 'Secret not configured at repo level. Digest body was built but not sent.'
              echo 'Add TELEGRAM_BOT_TOKEN to repo secrets to activate.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          send_one() {
            local chat_id="$1"
            local label="$2"
            local text
            text="$(cat "${MSG_FILE}")"

            # Encoding discipline per notification-protocol.md:
            # use --data-urlencode for raw UTF-8 — NEVER ascii-escape Cyrillic.
            local response
            response="$(curl -sS -o /tmp/tg_resp.json -w "%{http_code}" \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=${text}" || echo "000")"

            if [ "${response}" = "200" ]; then
              echo "✓ ${label} (chat ${chat_id}) — HTTP 200"
              return 0
            fi

            # Retry once after 5s
            sleep 5
            response="$(curl -sS -o /tmp/tg_resp.json -w "%{http_code}" \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=${text}" || echo "000")"

            if [ "${response}" = "200" ]; then
              echo "✓ ${label} (chat ${chat_id}) — HTTP 200 (retry)"
              return 0
            fi

            echo "✗ ${label} (chat ${chat_id}) — HTTP ${response}"
            cat /tmp/tg_resp.json || true
            return 1
          }

          # DM first, group second (per notification-protocol §«Order»).
          DM_OK=0
          GROUP_OK=0

          if send_one "${DM_CHAT_ID}" "DM"; then DM_OK=1; fi
          if send_one "${GROUP_CHAT_ID}" "Group"; then GROUP_OK=1; fi

          if [ "${DM_OK}" -eq 1 ] && [ "${GROUP_OK}" -eq 1 ]; then
            echo '## ✅ Telegram digest sent' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '## ⚠ Telegram digest partial / failed'
            echo ''
            echo "- DM sent: ${DM_OK}"
            echo "- Group sent: ${GROUP_OK}"
            echo ''
            echo 'Graceful-fail: not failing the job to avoid cron-spam noise.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
