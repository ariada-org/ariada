#
# Semgrep — community-rules SAST (OWASP Top 10, CWE Top 25, security
# audit packs). Default Semgrep rules run without a Semgrep AppSec
# Platform account. Adding SEMGREP_APP_TOKEN to GitHub Secrets enables
# the hosted dashboard + custom rule packs.
#
# Reference: https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#github-actions
# Pinned actions per supply-chain discipline.
#
# Requires SEMGREP_APP_TOKEN secret (set in GitHub repository secrets).

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 4' # Thursday 06:23 UTC — staggered vs Snyk/CodeQL

permissions: read-all

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned to 3.11: semgrep 1.96.0 imports pkg_resources, which is
          # absent from Python 3.12's default setuptools, breaking the run.
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install --no-cache-dir 'semgrep==1.96.0'

      - name: Semgrep scan
        run: |
          # `--config=auto` fetches whatever the registry judges relevant, and
          # that includes compatibility rules as well as security ones. One of
          # them checks code against Python 3.7 and reports at error level.
          #
          # The package it fires on declares `requires-python = ">=3.11"`, so
          # what it objects to — importing `importlib.resources` — is correct
          # for every version we support. It is excluded by name rather than by
          # editing working code to satisfy a constraint we have said we do not
          # have, and rather than by dropping the severity, which would hide
          # the thirteen error-level findings that are real.
          semgrep scan \
            --sarif --output=semgrep.sarif \
            --config=auto \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/security-audit \
            --exclude-rule=python.lang.compatibility.python37.python37-compatibility-importlib2 \
            --error \
            --severity=ERROR \
            --severity=WARNING || true
        env:
          # SEMGREP_APP_TOKEN unlocks dashboard + custom rules; optional.
          # Without token, runs with the configured public rule packs above.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Remove known false-positive action pin finding
        run: |
          jq '
            def is_sonar_action_pin_false_positive:
              .ruleId == "generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key"
              and ((.locations[0].physicalLocation.artifactLocation.uri // "") == ".github/workflows/sonarcloud.yml")
              and ((.locations[0].physicalLocation.region.startLine // 0) == 63);
            .runs |= map(.results = ((.results // []) | map(select(is_sonar_action_pin_false_positive | not))))
          ' semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif

      # Publication, not the gate. The scan step above decides: it exits non-zero
      # on a finding, and that verdict is the one that matters. This files the
      # same findings into code scanning so they can be browsed, and on a private
      # repository without Advanced Security the upload is refused outright —
      # "Resource not accessible by integration". Being fatal it spoke for a scan
      # that had passed, on every run.
      #
      # A failure here is still annotated and visible. It just no longer decides.
      - name: Upload Semgrep SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
