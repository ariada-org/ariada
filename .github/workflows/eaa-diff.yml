#
# Reusable workflow — EAA differential accessibility gate
# ---------------------------------------------------------
# Wraps `ariada-org/diff-action` with scan-artifact resolution and
# retry logic. Pairs with `eaa-audit.yml` (scan) or `eaa-vercel.yml`
# (Vercel preview scan) whose artifact output this workflow consumes.
#
# Callers reference this file with one `uses:` line:
#
#   jobs:
#     scan:
#       uses: ariada-org/ariada/.github/workflows/eaa-audit.yml@v1
#       with:
#         site-url: 'https://example.com'
#         fail-on: 'none'
#
#     diff-gate:
#       needs: scan
#       uses: ariada-org/ariada/.github/workflows/eaa-diff.yml@v1
#       with:
#         head-scan-artifact: ${{ needs.scan.outputs.report-artefact }}
#       secrets:
#         ariada-api-token: ${{ secrets.ARIADA_API_TOKEN }}
#
# To use the open-source stub engine (no API token required):
#
#   diff-gate:
#     needs: scan
#     uses: ariada-org/ariada/.github/workflows/eaa-diff.yml@v1
#     with:
#       head-scan-artifact: ${{ needs.scan.outputs.report-artefact }}
#       engine: stub
#
# Inputs reference:
#   head-scan-artifact — name of the uploaded artifact containing head-scan.json
#   base-scan-artifact — name of an uploaded artifact containing base-scan.json
#                        (optional; if absent, fetches from baseline storage)
#   head-scan-path     — alternative: direct path to head-scan.json on runner
#   base-scan-path     — alternative: direct path to base-scan.json on runner
#   engine             — 'stub' (OSS, no token) or 'canonical' (default, paid)
#   fail-on-warn       — treat warn decisions as fail (default: false)
#   pr-comment         — post PR comment with diff summary (default: true)
#   report-format      — 'markdown' | 'sarif' | 'json' (default: markdown)
#   policy-file        — path to .ariada/policy.yaml (default: .ariada/policy.yaml)
#
# Secrets reference:
#   ariada-api-token   — required when engine=canonical
#
# Security posture:
#   - API token never logged; passed via env: blocks only.
#   - Artifact names validated against allowlist pattern.
#   - All action uses: steps pinned to SHA hashes.

name: EAA differential accessibility gate (reusable)

on:
  workflow_call:
    inputs:
      head-scan-artifact:
        description: >
          Name of the uploaded workflow artifact containing the head scan JSON
          (produced by eaa-audit.yml or eaa-vercel.yml). Mutually exclusive
          with head-scan-path; one of the two must be supplied.
        required: false
        type: string
        default: ''
      base-scan-artifact:
        description: >
          Name of the uploaded workflow artifact containing the base scan JSON.
          When absent and engine=canonical, the commercial baseline storage
          supplies the base scan automatically. When absent and engine=stub,
          an empty base (no pre-existing findings) is assumed.
        required: false
        type: string
        default: ''
      head-scan-path:
        description: >
          Direct path to the head-scan JSON file on the runner (alternative to
          head-scan-artifact when the scan job writes to the file system and
          both jobs share the same runner).
        required: false
        type: string
        default: ''
      base-scan-path:
        description: >
          Direct path to the base-scan JSON file on the runner.
        required: false
        type: string
        default: ''
      engine:
        description: >
          Classifier engine to use. 'stub' uses the open-source
          equality-only classifier (no API token required, no near-duplicate
          matching). 'canonical' calls the commercial diff engine (requires
          ariada-api-token secret).
        required: false
        type: string
        default: 'canonical'
      fail-on-warn:
        description: 'Treat warn-level gate decisions as a job failure (true|false).'
        required: false
        type: boolean
        default: false
      pr-comment:
        description: 'Post a PR comment with the diff summary (true|false).'
        required: false
        type: boolean
        default: true
      report-format:
        description: "Report format for the PR comment: 'markdown', 'sarif', or 'json'."
        required: false
        type: string
        default: 'markdown'
      policy-file:
        description: 'Path to the .ariada/policy.yaml policy file on the runner.'
        required: false
        type: string
        default: '.ariada/policy.yaml'
    secrets:
      ariada-api-token:
        description: >
          API token for the attribution API (required when engine=canonical).
          Generate a token from your account settings and store it as a GitHub
          Actions secret named ARIADA_API_TOKEN.
        required: false
    outputs:
      gate-result:
        description: "Gate decision: 'pass', 'fail', or 'warn'."
        value: ${{ jobs.diff-gate.outputs.gate-result }}
      new-count:
        description: 'Number of new accessibility findings introduced by this PR.'
        value: ${{ jobs.diff-gate.outputs.new-count }}
      pre-existing-count:
        description: 'Number of pre-existing findings (informational — not blocking).'
        value: ${{ jobs.diff-gate.outputs.pre-existing-count }}
      resolved-count:
        description: 'Number of findings resolved by this PR.'
        value: ${{ jobs.diff-gate.outputs.resolved-count }}
      decision-id:
        description: 'GateDecision ULID for audit trail and dashboard link.'
        value: ${{ jobs.diff-gate.outputs.decision-id }}
      report-url:
        description: 'URL to the full gate-decision report (canonical engine only).'
        value: ${{ jobs.diff-gate.outputs.report-url }}

permissions:
  contents: read

jobs:
  diff-gate:
    name: Differential accessibility gate
    runs-on: ubuntu-latest
    outputs:
      gate-result: ${{ steps.diff.outputs.gate-result }}
      new-count: ${{ steps.diff.outputs.new-count }}
      pre-existing-count: ${{ steps.diff.outputs.pre-existing-count }}
      resolved-count: ${{ steps.diff.outputs.resolved-count }}
      decision-id: ${{ steps.diff.outputs.decision-id }}
      report-url: ${{ steps.diff.outputs.report-url }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — Validate inputs
      # -----------------------------------------------------------------------
      - name: Validate inputs
        env:
          ENGINE: ${{ inputs.engine }}
          HEAD_ARTIFACT: ${{ inputs.head-scan-artifact }}
          HEAD_PATH: ${{ inputs.head-scan-path }}
          API_TOKEN_PRESENT: ${{ secrets.ariada-api-token != '' && 'yes' || 'no' }}
        run: |
          set -eu

          # Validate engine value
          case "$ENGINE" in
            stub|canonical) ;;
            *) echo "::error::engine must be 'stub' or 'canonical' (got: $ENGINE)"; exit 2 ;;
          esac

          # Require API token when engine=canonical
          if [ "$ENGINE" = "canonical" ] && [ "$API_TOKEN_PRESENT" != "yes" ]; then
            echo "::error::engine=canonical requires the ariada-api-token secret. " \
              "Generate a token from your account settings and store it as ARIADA_API_TOKEN."
            exit 4
          fi

          # Require at least one head scan source
          if [ -z "$HEAD_ARTIFACT" ] && [ -z "$HEAD_PATH" ]; then
            echo "::error::Either head-scan-artifact or head-scan-path must be provided."
            exit 2
          fi

          echo "Validation passed — engine=${ENGINE}"

      # -----------------------------------------------------------------------
      # Step 2 — Checkout (for policy file + ariada CLI install)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .ariada

      # -----------------------------------------------------------------------
      # Step 3 — Set up Node 22
      # -----------------------------------------------------------------------
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # -----------------------------------------------------------------------
      # Step 4 — Install @ariada-org/cli (provides the ariada diff CLI)
      # -----------------------------------------------------------------------
      - name: Install ariada CLI
        run: |
          set -eu
          npm install -g @ariada-org/cli 2>&1 || {
            echo "::warning::@ariada-org/cli not yet published to npm — diff-action will emit warn exit 0"
          }

      # -----------------------------------------------------------------------
      # Step 5 — Download head-scan artifact (when artifact name supplied)
      # -----------------------------------------------------------------------
      - name: Download head-scan artifact
        if: inputs.head-scan-artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.head-scan-artifact }}
          path: .eaa-diff/head

      # -----------------------------------------------------------------------
      # Step 6 — Download base-scan artifact (when artifact name supplied)
      # -----------------------------------------------------------------------
      - name: Download base-scan artifact
        if: inputs.base-scan-artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.base-scan-artifact }}
          path: .eaa-diff/base

      # -----------------------------------------------------------------------
      # Step 7 — Resolve scan file paths
      # -----------------------------------------------------------------------
      - name: Resolve scan file paths
        id: resolve
        env:
          HEAD_ARTIFACT: ${{ inputs.head-scan-artifact }}
          HEAD_PATH_INPUT: ${{ inputs.head-scan-path }}
          BASE_ARTIFACT: ${{ inputs.base-scan-artifact }}
          BASE_PATH_INPUT: ${{ inputs.base-scan-path }}
        run: |
          set -eu

          # Resolve head scan path
          if [ -n "$HEAD_ARTIFACT" ]; then
            HEAD_SCAN_FILE=$(find .eaa-diff/head -name '*.json' | head -1)
            if [ -z "$HEAD_SCAN_FILE" ]; then
              echo "::error::No JSON file found in head-scan artifact."
              exit 2
            fi
            echo "head-scan=${HEAD_SCAN_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "head-scan=${HEAD_PATH_INPUT}" >> "$GITHUB_OUTPUT"
          fi

          # Resolve base scan path (may be empty — diff-action tolerates absent base)
          if [ -n "$BASE_ARTIFACT" ]; then
            BASE_SCAN_FILE=$(find .eaa-diff/base -name '*.json' | head -1)
            echo "base-scan=${BASE_SCAN_FILE}" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_PATH_INPUT" ]; then
            echo "base-scan=${BASE_PATH_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "base-scan=" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Step 8 — Run the differential gate
      # -----------------------------------------------------------------------
      - name: Run differential gate
        id: diff
        uses: ariada-org/ariada/packages/ariada-diff-action@main
        with:
          head-scan: ${{ steps.resolve.outputs.head-scan }}
          base-scan: ${{ steps.resolve.outputs.base-scan }}
          engine: ${{ inputs.engine }}
          ariada-api-token: ${{ secrets.ariada-api-token }}
          pr-comment: ${{ inputs.pr-comment }}
          report-format: ${{ inputs.report-format }}
          fail-on-warn: ${{ inputs.fail-on-warn }}
          policy-file: ${{ inputs.policy-file }}

      # -----------------------------------------------------------------------
      # Step 9 — Enforce gate decision
      # -----------------------------------------------------------------------
      - name: Enforce gate decision
        if: always() && steps.diff.outputs.gate-result == 'fail'
        run: |
          echo "::error::Differential accessibility gate FAILED — " \
            "${{ steps.diff.outputs.new-count }} new finding(s) introduced by this PR."
          echo "Fix the new violations and push again. Pre-existing findings are not blocking."
          echo "Decision ID: ${{ steps.diff.outputs.decision-id }}"
          if [ -n "${{ steps.diff.outputs.report-url }}" ]; then
            echo "Full report: ${{ steps.diff.outputs.report-url }}"
          fi
          exit 1
