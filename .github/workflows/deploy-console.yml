# Deploy the Ariada audit console (SvelteKit, adapter-static) to Cloudflare
# Pages → app.ariada.org. Mirrors deploy-marketing.yml.
#
# PREREQUISITE (founder, one-time, in the Cloudflare dashboard):
#   1. Create a Cloudflare Pages project named `ariada-console`.
#   2. Bind the custom domain `app.ariada.org` to it.
#   3. Put Cloudflare Access in front (the demo/demo gate in the app is only an
#      interim convenience, not a security boundary).
# Secrets already present for the marketing deploy are reused:
#   CLOUDFLARE_API_TOKEN  — scoped to Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID — the account id
name: Deploy console

on:
  push:
    branches: [main]
    paths:
      - 'apps/ariada-console/**'
      - '.github/workflows/deploy-console.yml'
  workflow_dispatch:

# Without this the run gets the default token, which on many repositories means
# write across everything. One thing is needed here: reading the tree in order to
# build it. The deployment authenticates with its own key, not with the run's
# token.
permissions:
  contents: read

concurrency:
  group: deploy-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # BLOCKER (M7.3): the console depends on @agonist/admin-surface +
      # @agonist/admin-svelte via file: links to ../../../saas/packages/*, which
      # do NOT exist in this repo's CI checkout. Before this workflow can run,
      # those packages must be published to npm (or vendored) and the console's
      # package.json switched from file: to the published version. Until then,
      # deploy manually from a machine that has the saas repo checked out.
      - name: Install + build (console only)
        working-directory: apps/ariada-console
        run: |
          pnpm install --ignore-workspace
          pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/ariada-console/build --project-name=ariada-console --branch=main
