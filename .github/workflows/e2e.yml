#
# E2E + Integration test workflow with full Playwright artifact capture.
#
# Why a dedicated workflow (separate from ci.yml):
#   - CI matrix per E2E-bearing package keeps the artifact namespace clean
#     (one `playwright-report-<package>` upload per matrix leg).
#   - 30-day artifact retention preserves trace + screenshot evidence for
#     EAA / EN 301 549 §11 audit-trail purposes.
#   - Decouples expensive browser install from the fast lint/build path
#     in ci.yml; the latter still runs `pnpm turbo run test:e2e` as a
#     belt-and-braces fallback.
#
# Matrix packages MUST have a `test:e2e` script that produces:
#   - playwright-report/  (HTML report)
#   - test-results/       (traces, screenshots, attachments)

name: E2E + Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.package }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - wcag-rules-extended
          - core-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies (turbo ^build)
        run: pnpm turbo run build --filter=@ariada-org/${{ matrix.package }}^...

      - name: Install Playwright browsers
        run: pnpm --filter @ariada-org/${{ matrix.package }} exec playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: packages/${{ matrix.package }}
        run: pnpm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test-results (traces + screenshots)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-screenshots-${{ matrix.package }}
          path: packages/${{ matrix.package }}/test-results/
          retention-days: 30
          if-no-files-found: ignore

  integration:
    name: Integration (cross-package)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

      - name: Install Playwright (chromium only)
        run: pnpm --filter @ariada-org/core-playwright exec playwright install --with-deps chromium

      - name: Run integration tests (vitest integration configs)
        run: pnpm turbo run test:e2e --filter=@ariada-org/core-playwright

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: integration-results
          path: |
            packages/*/test-results/
            packages/*/coverage/
            test-results/integration/
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: E2E + Integration summary
    runs-on: ubuntu-22.04
    needs: [e2e, integration]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "E2E matrix status: ${{ needs.e2e.result }}"
          echo "Integration status: ${{ needs.integration.result }}"
          if [[ "${{ needs.e2e.result }}" != "success" || "${{ needs.integration.result }}" != "success" ]]; then
            echo "::warning::One or more E2E/integration jobs failed — see uploaded artifacts."
          fi
