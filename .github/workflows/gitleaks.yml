name: gitleaks

# Scans every PR + push for committed secrets. Full-history scan on weekly schedule.
#
# Uses the MIT-licensed `gitleaks` binary directly. The `gitleaks-action`
# wrapper requires a paid GITLEAKS_LICENSE for org-owned repos since the
# 2024 license-key change — we sidestep that by installing the upstream
# binary ourselves (the scanner itself remains MIT).

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, release-base]
  schedule:
    - cron: "23 4 * * 1" # Monday 04:23 UTC — full-history sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write # for SARIF upload to code-scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clone for push/PR (only current code matters).
          # Full history for the weekly schedule scan.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
          persist-credentials: false

      - name: Download gitleaks
        # Latest stable on 2026-05-20 = v8.30.1
        # (`gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name`).
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks scan
        run: |
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.29.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
