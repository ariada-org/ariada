name: gitleaks

# Scans every PR + push for committed secrets. Full-history scan on weekly schedule.
#
# Uses the MIT-licensed `gitleaks` binary directly. The `gitleaks-action`
# wrapper requires a paid GITLEAKS_LICENSE for org-owned repos since the
# 2024 license-key change — we sidestep that by installing the upstream
# binary ourselves (the scanner itself remains MIT).

# `staging` is deliberately not in the push list: it always has a pull request
# open against `main`, so this already runs there through the pull-request
# trigger. Listing it as well scanned every commit twice under one required
# check name, and a required name is refused while any copy of it is red.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-base]
  schedule:
    - cron: '23 4 * * 1' # Monday 04:23 UTC — full-history sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write # for SARIF upload to code-scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clone for push/PR (only current code matters).
          # Full history for the weekly schedule scan.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
          persist-credentials: false

      - name: Download gitleaks
        # Latest stable on 2026-05-20 = v8.30.1
        # (`gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name`).
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks scan
        run: |
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      # Publication, not the gate. The gate is the step above: `--exit-code 1`
      # fails the job when the scan finds something, and that verdict decides.
      #
      # This step files the same findings into code scanning so they can be
      # browsed. On a private repository without Advanced Security that upload
      # is refused — "Resource not accessible by integration" — and being fatal
      # it kept the check red on every run whether or not the scan was clean.
      #
      # Which is the condition this whole gate was just repaired out of: red for
      # a reason unrelated to what it guards, long enough to read as normal. A
      # failure here is still shown, annotated and visible; it just no longer
      # speaks for the scan.
      - name: Upload SARIF
        continue-on-error: true
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
