# SPDX-License-Identifier: EUPL-1.2
# Release verification and approval only. No job deploys production.

name: Ariada Wiki RC

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Release-gate operation
        required: true
        type: choice
        options:
          - verify-canary
          - promotion-gate
      pull_request_number:
        description: Merged pull request number whose merge commit is current main
        required: true
        type: string
      canary_url:
        description: HTTPS immutable Ariada Wiki Pages deployment origin
        required: true
        type: string

permissions: {}

concurrency:
  group: ariada-wiki-rc-${{ github.event_name }}-${{ github.ref }}-${{ inputs.operation || 'validation' }}
  cancel-in-progress: false

jobs:
  gate-governance:
    name: Ariada Wiki RC / Gate governance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run all release-governance tests
        run: >-
          node --test
          ci/wiki-rc-content-manifest.test.mjs
          ci/wiki-rc-gate.test.mjs
          ci/wiki-rc-monitor.test.mjs
          ci/wiki-rc-monitor-aggregate.test.mjs

      - name: Run actionlint on both release workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            .github/workflows/ariada-wiki-rc.yml \
            .github/workflows/ariada-wiki-monitor.yml

  wiki-validation:
    name: Ariada Wiki RC / Wiki validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, and validate standalone Ariada Wiki
        run: |
          pnpm --filter ariada-wiki test
          pnpm --filter ariada-wiki build
          pnpm --filter ariada-wiki check

  companion-validation:
    name: Ariada Wiki RC / Companion validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Ariada main-site companion
        run: |
          pnpm --filter ariada-org test:contracts
          pnpm --filter ariada-org build

  post-merge-artifact:
    name: Ariada Wiki RC / Post-merge artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, and validate standalone Ariada Wiki
        run: |
          pnpm --filter ariada-wiki test
          pnpm --filter ariada-wiki build
          pnpm --filter ariada-wiki check

      - name: Create deterministic immutable release artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .wiki-rc
          generated_at="$(git show -s --format=%cI "$RELEASE_SHA")"
          node ci/wiki-rc-content-manifest.mjs generate \
            --dist apps/ariada-wiki/dist \
            --release-sha "$RELEASE_SHA" \
            --generated-at "$generated_at" \
            --copy .wiki-rc/release-manifest.json
          node ci/wiki-rc-content-manifest.mjs validate \
            --dist apps/ariada-wiki/dist \
            --manifest .wiki-rc/release-manifest.json
          tar_file="ariada-wiki-${RELEASE_SHA}.tar.gz"
          tar --format=ustar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C apps/ariada-wiki/dist . | gzip -n -9 > ".wiki-rc/${tar_file}"
          tar_sha256="$(sha256sum ".wiki-rc/${tar_file}" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$tar_sha256" "$tar_file" > ".wiki-rc/${tar_file}.sha256"

      - name: Upload immutable post-merge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ariada-wiki-rc-${{ github.sha }}
          path: |
            .wiki-rc/ariada-wiki-${{ github.sha }}.tar.gz
            .wiki-rc/ariada-wiki-${{ github.sha }}.tar.gz.sha256
            .wiki-rc/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

  verify-canary:
    name: Ariada Wiki RC / Canary verification
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-canary' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout exact protected main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve merged PR and post-merge artifact from GitHub
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          node ci/wiki-rc-gate.mjs resolve-build \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --current-main-sha "$GITHUB_SHA" \
            --output .wiki-rc/build.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact immutable post-merge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact-id }}
          path: .wiki-rc/build-artifact
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run-id }}

      - name: Verify immutable canary manifest and deployment provenance
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANARY_URL: ${{ inputs.canary_url }}
        run: |
          node ci/wiki-rc-gate.mjs verify-canary \
            --build .wiki-rc/build.json \
            --artifact-directory .wiki-rc/build-artifact \
            --canary-url "$CANARY_URL" \
            --output .wiki-rc/canary-evidence.json \
            --manifest-output .wiki-rc/release-manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload trusted canary evidence
        id: upload-canary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ariada-wiki-canary-evidence-${{ steps.resolve.outputs.release-sha }}
          path: |
            .wiki-rc/canary-evidence.json
            .wiki-rc/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: true

      - name: Publish nonsecret monitor configuration
        env:
          RELEASE_SHA: ${{ steps.verify.outputs.release-sha }}
          FINAL_TAR_SHA256: ${{ steps.verify.outputs.final-tar-sha256 }}
          RELEASE_MANIFEST_SHA256: ${{ steps.verify.outputs.release-manifest-sha256 }}
          RELEASE_CONTENT_SET_SHA256: ${{ steps.verify.outputs.content-set-sha256 }}
          DEPLOYMENT_ID: ${{ steps.verify.outputs.deployment-id }}
          CANARY_ARTIFACT_ID: ${{ steps.upload-canary.outputs.artifact-id }}
          CANARY_URL: ${{ inputs.canary_url }}
        run: |
          {
            printf '%s\n\n' '### Ariada Wiki monitor variables'
            printf '%s\n' "- \`ARIADA_WIKI_RELEASE_SHA=${RELEASE_SHA}\`"
            printf '%s\n' "- \`ARIADA_WIKI_RELEASE_TAR_SHA256=${FINAL_TAR_SHA256}\`"
            printf '%s\n' "- \`ARIADA_WIKI_RELEASE_MANIFEST_SHA256=${RELEASE_MANIFEST_SHA256}\`"
            printf '%s\n' "- \`ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256=${RELEASE_CONTENT_SET_SHA256}\`"
            printf '%s\n' "- \`ARIADA_WIKI_RELEASE_DEPLOYMENT_ID=${DEPLOYMENT_ID}\`"
            printf '%s\n' "- \`ARIADA_WIKI_CANARY_ARTIFACT_ID=${CANARY_ARTIFACT_ID}\`"
            printf '%s\n' "- \`ARIADA_WIKI_CANARY_URL=${CANARY_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promotion-gate:
    name: Ariada Wiki RC / Production promotion gate
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promotion-gate' && github.ref == 'refs/heads/main'
    environment:
      name: ariada-wiki-promotion-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout exact protected main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve trusted promotion provenance
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          CANARY_URL: ${{ inputs.canary_url }}
          CANARY_ARTIFACT_ID: ${{ vars.ARIADA_WIKI_CANARY_ARTIFACT_ID }}
          MONITOR_ARTIFACT_ID: ${{ vars.ARIADA_WIKI_MONITOR_ARTIFACT_ID }}
        run: |
          node ci/wiki-rc-gate.mjs resolve-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --current-main-sha "$GITHUB_SHA" \
            --current-run-id "$GITHUB_RUN_ID" \
            --canary-url "$CANARY_URL" \
            --canary-artifact-id "$CANARY_ARTIFACT_ID" \
            --monitor-artifact-id "$MONITOR_ARTIFACT_ID" \
            --output .wiki-rc/promotion.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact raw canary evidence archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.canary-artifact-id }}
        run: |
          node ci/wiki-rc-gate.mjs download-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --output .wiki-rc/canary-evidence.zip

      - name: Download exact raw monitor aggregate archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.monitor-artifact-id }}
        run: |
          node ci/wiki-rc-gate.mjs download-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --output .wiki-rc/monitor-evidence.zip

      - name: Enforce fail-closed production promotion gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node ci/wiki-rc-gate.mjs promotion-gate \
            --resolution .wiki-rc/promotion.json \
            --canary-archive .wiki-rc/canary-evidence.zip \
            --monitor-archive .wiki-rc/monitor-evidence.zip
