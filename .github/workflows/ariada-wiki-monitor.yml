name: Ariada Wiki RC monitor

on:
  # Senko is the primary scheduler and dispatches aggregate=false every five
  # minutes. This offset GitHub cron is a best-effort fallback stream only.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      aggregate:
        description: Build the final 48-hour evidence artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Samples must remain concurrent across Senko and schedule. Final aggregate
  # dispatches serialize without cancelling evidence-producing runs.
  group: ariada-wiki-monitor-${{ inputs.aggregate && 'aggregate' || github.run_id }}
  cancel-in-progress: false

env:
  ARIADA_WIKI_RELEASE_SHA: ${{ vars.ARIADA_WIKI_RELEASE_SHA }}
  ARIADA_WIKI_RELEASE_TAR_SHA256: ${{ vars.ARIADA_WIKI_RELEASE_TAR_SHA256 }}
  ARIADA_WIKI_RELEASE_MANIFEST_SHA256: ${{ vars.ARIADA_WIKI_RELEASE_MANIFEST_SHA256 }}
  ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256: ${{ vars.ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256 }}
  ARIADA_WIKI_CANARY_URL: ${{ vars.ARIADA_WIKI_CANARY_URL }}
  ARIADA_WIKI_RELEASE_DEPLOYMENT_ID: ${{ vars.ARIADA_WIKI_RELEASE_DEPLOYMENT_ID }}
  ARIADA_WIKI_MONITOR_DISPATCH_ACTOR: ${{ vars.ARIADA_WIKI_MONITOR_DISPATCH_ACTOR }}
  ARIADA_WIKI_CANARY_ARTIFACT_ID: ${{ vars.ARIADA_WIKI_CANARY_ARTIFACT_ID }}
  # Senko/operator sets this from the aggregate upload summary before the gate.
  ARIADA_WIKI_MONITOR_ARTIFACT_ID: ${{ vars.ARIADA_WIKI_MONITOR_ARTIFACT_ID }}

jobs:
  sample:
    name: Trusted five-minute sample
    if: >-
      github.repository != '' &&
      github.ref == 'refs/heads/main' &&
      github.sha == vars.ARIADA_WIKI_RELEASE_SHA &&
      github.workflow_ref == format('{0}/.github/workflows/ariada-wiki-monitor.yml@refs/heads/main', github.repository) &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == vars.ARIADA_WIKI_MONITOR_DISPATCH_ACTOR &&
          github.triggering_actor == vars.ARIADA_WIKI_MONITOR_DISPATCH_ACTOR
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Probe immutable Ariada Wiki deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wiki-monitor
          node ci/wiki-rc-monitor.mjs probe \
            --release-sha "$ARIADA_WIKI_RELEASE_SHA" \
            --artifact-digest "$ARIADA_WIKI_RELEASE_TAR_SHA256" \
            --manifest-sha256 "$ARIADA_WIKI_RELEASE_MANIFEST_SHA256" \
            --content-set-sha256 "$ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256" \
            --url "$ARIADA_WIKI_CANARY_URL" \
            --deployment-id "$ARIADA_WIKI_RELEASE_DEPLOYMENT_ID" \
            --workflow-head-sha "$GITHUB_SHA" \
            --output .wiki-monitor/sample.json

      - name: Upload exact-name sample artifact
        id: sample_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ariada-wiki-monitor-sample-${{ env.ARIADA_WIKI_RELEASE_SHA }}
          path: .wiki-monitor/sample.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          overwrite: false
          retention-days: 8

      - name: Surface sample artifact ID
        if: always() && steps.sample_upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.sample_upload.outputs.artifact-id }}
          ARTIFACT_NAME: ariada-wiki-monitor-sample-${{ env.ARIADA_WIKI_RELEASE_SHA }}
        shell: bash
        run: |
          {
            echo "### Ariada Wiki monitor sample artifact"
            echo "- Name: \`$ARTIFACT_NAME\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce healthy sample
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node ci/wiki-rc-monitor.mjs assert \
            --release-sha "$ARIADA_WIKI_RELEASE_SHA" \
            --artifact-digest "$ARIADA_WIKI_RELEASE_TAR_SHA256" \
            --manifest-sha256 "$ARIADA_WIKI_RELEASE_MANIFEST_SHA256" \
            --content-set-sha256 "$ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256" \
            --url "$ARIADA_WIKI_CANARY_URL" \
            --deployment-id "$ARIADA_WIKI_RELEASE_DEPLOYMENT_ID" \
            --workflow-head-sha "$GITHUB_SHA" \
            --sample .wiki-monitor/sample.json

  aggregate:
    name: Build trusted 48-hour monitor evidence
    if: github.event_name == 'workflow_dispatch' && inputs.aggregate
    needs: sample
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate GitHub provenance and aggregate canonical coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wiki-monitor
          node ci/wiki-rc-monitor-aggregate.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$ARIADA_WIKI_RELEASE_SHA" \
            --artifact-digest "$ARIADA_WIKI_RELEASE_TAR_SHA256" \
            --manifest-sha256 "$ARIADA_WIKI_RELEASE_MANIFEST_SHA256" \
            --content-set-sha256 "$ARIADA_WIKI_RELEASE_CONTENT_SET_SHA256" \
            --url "$ARIADA_WIKI_CANARY_URL" \
            --deployment-id "$ARIADA_WIKI_RELEASE_DEPLOYMENT_ID" \
            --current-run-id "$GITHUB_RUN_ID" \
            --dispatch-actor "$ARIADA_WIKI_MONITOR_DISPATCH_ACTOR" \
            --canary-artifact-id "$ARIADA_WIKI_CANARY_ARTIFACT_ID" \
            --output .wiki-monitor/monitor.json

      - name: Upload aggregate evidence
        id: aggregate_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ariada-wiki-monitor-evidence-${{ env.ARIADA_WIKI_RELEASE_SHA }}
          path: .wiki-monitor/monitor.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          overwrite: false
          retention-days: 8

      - name: Surface aggregate artifact ID for the gate
        env:
          ARTIFACT_ID: ${{ steps.aggregate_upload.outputs.artifact-id }}
          ARTIFACT_NAME: ariada-wiki-monitor-evidence-${{ env.ARIADA_WIKI_RELEASE_SHA }}
        shell: bash
        run: |
          test -n "$ARTIFACT_ID"
          {
            echo "### Ariada Wiki aggregate artifact"
            echo "- Name: \`$ARTIFACT_NAME\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Gate variable: \`ARIADA_WIKI_MONITOR_ARTIFACT_ID=$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
