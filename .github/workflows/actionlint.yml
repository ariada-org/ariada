name: actionlint

# Lints all .github/workflows/*.yml for syntax errors, deprecated runners, expression typos,
# and embedded shellcheck violations inside `run:` blocks. Free MIT (rhysd/actionlint).
# Catches the kind of bugs that the Trivy supply-chain attack (March 2026) exploited.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run actionlint
        # Use the official upstream installer script — pinned to commit SHA in production.
        # Latest stable: actionlint v1.7.4 (2026-03).
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
