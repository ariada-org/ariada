name: actionlint

# Wave-1 OSS audit (per strategy/oss-and-audit/OSS_AUDIT_AND_CODE_REVIEW_STRATEGY.md §5.1 #3).
# Lints all .github/workflows/*.yml for syntax errors, deprecated runners, expression typos,
# and embedded shellcheck violations inside `run:` blocks. Free MIT (rhysd/actionlint).
# Catches the kind of bugs that the Trivy supply-chain attack (March 2026) exploited.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run actionlint
        # Use the official upstream installer script — pinned to commit SHA in production.
        # Latest stable: actionlint v1.7.4 (2026-03).
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
