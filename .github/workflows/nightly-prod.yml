name: Nightly Production Smoke

# Daily smoke + visual regression sweep against the deployed landing
# properties. Catches:
#   - Cloudflare Pages cert expiry
#   - DNS / origin drift
#   - Content loss after a bad rollback
#   - Visual regression from CDN cache bugs
#
# Failure surfaces via GitHub issue (auto-opened) and uploaded artifacts.

on:
  schedule:
    # 06:00 UTC daily (07:00 CET / 08:00 CEST). Quiet enough to not race
    # with traffic, late enough that any midnight CF deploy has settled.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke (nightly)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # auto-open an issue when the nightly run fails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # pnpm version pinned via package.json `packageManager` — explicit
      # `version:` here triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @adopta/production-smoke exec playwright install --with-deps chromium

      - name: Run production smoke + visual regression
        id: smoke
        run: pnpm --filter @adopta/production-smoke run test:production

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-prod-report-${{ github.run_id }}
          path: tests/production-smoke/playwright-report/
          retention-days: 30

      - name: Upload visual regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-prod-visual-diffs-${{ github.run_id }}
          path: tests/production-smoke/test-results/
          retention-days: 30

      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = `Nightly production smoke failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              '`Nightly Production Smoke` workflow failed.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Artifacts to inspect:',
              `- nightly-prod-report-${context.runId} (Playwright HTML report)`,
              `- nightly-prod-visual-diffs-${context.runId} (visual regression diffs)`,
              '',
              'Triage steps:',
              '1. Download the report artifact and open `index.html`.',
              '2. If visual diff: confirm intentional design change → `pnpm --filter @adopta/production-smoke run test:visual:update` and commit new baselines.',
              '3. If a11y / availability / content regression: investigate the offending domain.',
              '4. Close this issue once the next nightly run passes.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-smoke', 'incident'],
            });
