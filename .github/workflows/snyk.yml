#
# Snyk — SCA (Open Source dependency vulnerabilities) + Snyk Code (SAST).
# Free for public OSS repos via the Snyk-funded OSS plan. Activates when
# SNYK_TOKEN is added to GitHub Secrets at the org/repo level.
#
# Reference: https://docs.snyk.io/integrate-with-snyk/ci-cd-integrations/github-actions-for-snyk-setup-and-checking-for-vulnerabilities
# Pinned actions per supply-chain discipline.
#
# Requires SNYK_TOKEN secret (set in GitHub repository secrets).

name: Snyk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 3' # Wednesday 06:17 UTC — staggered vs CodeQL/Scorecard

permissions: read-all

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk-test:
    name: Snyk SCA + Code
    runs-on: ubuntu-22.04
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snyk Open Source (SCA)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # master pin
        continue-on-error: true # don't fail the build on vuln finding; report to dashboard
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --sarif-file-output=snyk-sca.sarif --severity-threshold=high

      - name: Upload Snyk SCA SARIF
        uses: github/codeql-action/upload-sarif@313a0b99225f41fe3a5666e8fa7b2d8048c194ec # v3.27.4
        if: always() && hashFiles('snyk-sca.sarif') != ''
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Snyk Code (SAST)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # master pin
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --sarif-file-output=snyk-code.sarif --severity-threshold=high

      - name: Upload Snyk Code SARIF
        uses: github/codeql-action/upload-sarif@313a0b99225f41fe3a5666e8fa7b2d8048c194ec # v3.27.4
        if: always() && hashFiles('snyk-code.sarif') != ''
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
