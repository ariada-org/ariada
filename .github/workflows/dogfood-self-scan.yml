#
# Dogfood self-scan — runs the reusable EAA audit workflow against the
# project's own public site on a weekly cadence and on demand.
#
# Why this workflow exists:
#   The reusable workflow `.github/workflows/eaa-audit.yml` is the
#   canonical entry point for downstream consumers — they pin it via
#   `uses: ariada-org/ariada/.github/workflows/eaa-audit.yml@v1`. We
#   dogfood it against our own site so that (a) the workflow is
#   exercised continuously against a real-world target and (b) the
#   resulting artefact set demonstrates end-to-end output (report.json
#   + accessibility-statement.html + vpat.json + accessibility.json) on
#   every run.
#
# First-run prerequisites:
#   The reusable workflow runs `pnpm add @ariada-org/wcag-rules-extended@<pack-version>`
#   on every invocation. The rule pack must therefore be published to
#   npm before this workflow can succeed. Until then, workflow_dispatch
#   runs will fail at the "Prepare scratch project" step.
#
# Cadence:
#   - Weekly Monday 06:00 UTC (low-traffic window, well before EU work
#     hours so artefacts are ready when the team comes online).
#   - On demand via workflow_dispatch.
#
# Failure handling:
#   `eaa-audit.yml` exits non-zero when violations at the `fail-on`
#   impact levels are present. For the dogfood case we want the workflow
#   to keep producing artefacts even when the site has known issues, so
#   we set fail-on to "critical" only — the workflow stays green for
#   serious/moderate/minor and we triage via the uploaded report.

name: Dogfood self-scan

on:
  # The rule pack @ariada-org/wcag-rules-extended is published to npm (0.1.0,
  # 2026-06-15), so the reusable audit's install step succeeds and the weekly
  # self-scan can run. Dogfood: our own scanner runs against our own public
  # site across the full audited route set every Monday.
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      site-url:
        description: 'Override site URL (must be https://). Defaults to https://ariada.org.'
        required: false
        type: string
        default: 'https://ariada.org'
      pages:
        description: 'Comma-separated paths to scan.'
        required: false
        type: string
        default: '/,/about/,/accessibility/,/architecture/,/demo/,/licenses/,/modules/,/packages/,/patents/,/pipeline/,/wcag-rules-extended/,/legal/patent-peace/'
      pack-version:
        description: 'npm dist-tag or semver of @ariada-org/wcag-rules-extended to install.'
        required: false
        type: string
        default: 'latest'

# Workflow-level token read-only; the job asks for exactly the two writes the
# work needs.
#
# An earlier revision removed the job block entirely, on the belief that a
# called workflow's own `permissions:` are passed through automatically when it
# lives in the same repository. They are not. The documented rule is the
# opposite — along a chain of reusable workflows permissions "can only be
# maintained or reduced, not elevated" — so the caller's grant is the ceiling
# and the callee cannot raise it. With only `contents: read` here, the audit's
# SARIF upload would have been refused.
#
# It would have been refused quietly, which is the part worth remembering. That
# step runs under `if: always()` and its outcome is recorded rather than fatal,
# so the run would stay green while the results stopped arriving in the security
# tab. A scan whose findings go nowhere looks exactly like a scan that found
# nothing.
#
# What is genuinely not needed is `pull-requests: write`. The audit posts a
# comment only under `if: github.event_name == 'pull_request'`, and this
# workflow runs on a schedule and on demand — never on a pull request. So that
# scope could never be exercised, and it is gone.
permissions:
  contents: read

jobs:
  self-scan:
    name: Self-scan
    permissions:
      contents: read
      security-events: write  # the audit uploads its SARIF
      actions: read           # and links back to the run that produced it
    uses: ./.github/workflows/eaa-audit.yml
    with:
      site-url: ${{ github.event.inputs.site-url || 'https://ariada.org' }}
      pages: ${{ github.event.inputs.pages || '/,/about/,/accessibility/,/architecture/,/demo/,/licenses/,/modules/,/packages/,/patents/,/pipeline/,/wcag-rules-extended/,/legal/patent-peace/' }}
      fail-on: 'critical'
      emit-statement: true
      emit-evidence: true
      pack-version: ${{ github.event.inputs.pack-version || 'latest' }}
