name: docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/core/**'
      - 'packages/rules-axe/**'
      - 'docs/adrs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/core/**'
      - 'packages/rules-axe/**'
      - 'docs/adrs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + a11y gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Whether the site this builds is in the checkout at all. It is held back
      # from the published tree by decision, while two of the three paths that
      # trigger this workflow — the engine and the rule pack — are published and
      # are not. So the first change to either of those there would start a run
      # that fails at the build of a package the checkout does not contain.
      #
      # It has not happened yet: no run of this workflow exists on that side.
      # Guarding it now costs a step and removes a failure that would otherwise
      # arrive with somebody else's ordinary commit.
      - name: Is the site here
        id: est
        run: |
          if [ -f apps/docs/package.json ]; then
            echo "da=1" >> "$GITHUB_OUTPUT"
          else
            echo "da=0" >> "$GITHUB_OUTPUT"
            echo "apps/docs is not in this checkout — the rest of this job is skipped."
          fi

      # pnpm version pinned via package.json `packageManager`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.est.outputs.da == '1'
        with:
          version: '9.15.0'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.est.outputs.da == '1'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.est.outputs.da == '1'
        run: pnpm install --frozen-lockfile

      # @ariada-org/core powers the Cobbler's Shoes a11y gate; @ariada-org/rules-axe is
      # the analyzer it loads. Both must compile before the docs site can scan
      # itself with the full TS API surface.
      - name: Build @ariada-org/core
        if: steps.est.outputs.da == '1'
        run: pnpm --filter @ariada-org/core build

      - name: Build @ariada-org/rules-axe
        if: steps.est.outputs.da == '1'
        run: pnpm --filter @ariada-org/rules-axe build

      - name: Build docs site (Starlight + Pagefind + TypeDoc)
        if: steps.est.outputs.da == '1'
        run: pnpm --filter @ariada-org/app-docs build
        timeout-minutes: 5

      - name: Verify build size budgets
        if: steps.est.outputs.da == '1'
        run: |
          echo "Pagefind index size:"
          du -sh apps/docs/dist/pagefind || true
          echo "Total dist/ size:"
          du -sh apps/docs/dist || true
          echo "HTML page count:"
          find apps/docs/dist -name '*.html' | wc -l

      - name: Install Playwright browsers
        if: steps.est.outputs.da == '1'
        # `pnpm exec playwright` fails at the workspace root because no root-level
        # package declares playwright directly (it is transitive via
        # @ariada-org/core → core-playwright). Use the version-pinned dlx form so
        # the chromium browser the a11y gate's scanner needs is installed into the
        # shared playwright cache regardless of workspace hoisting.
        run: pnpm dlx playwright@1.49.0 install --with-deps chromium

      - name: Cobbler's Shoes — axe-core 0-violation gate
        if: steps.est.outputs.da == '1'
        run: pnpm --filter @ariada-org/app-docs run a11y:ci

      - name: Upload built site (debug artifact)
        if: always() && steps.est.outputs.da == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 7
          if-no-files-found: warn

  # Deployment to Cloudflare Pages is configured separately via the Pages
  # dashboard (Wrangler GitHub integration → connect to repo → "apps/docs"
  # build directory → output `dist/`). Per ADR-003 we are on the free tier and
  # don't run wrangler deploy from CI; CF Pages picks up `main` pushes
  # automatically. This workflow's job is to gate the merge, not the deploy.
