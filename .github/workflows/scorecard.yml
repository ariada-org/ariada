name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1' # Monday 04:17 UTC
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-22.04
    permissions:
      security-events: write # Upload Scorecard SARIF to code scanning.
      id-token: write # Publish signed Scorecard results.
      contents: read # Read repository contents.
      actions: read # Inspect workflow metadata for Scorecard checks.
      issues: read # Inspect issue activity for maintenance signals.
      pull-requests: read # Inspect PR review metadata.
      checks: read # Inspect check-run metadata.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # Floating `@v2` tag was removed by OSSF; pin to specific release.
        # SHA below is the commit SHA (not the annotated-tag-object SHA);
        # scorecard's imposter-commit verification only accepts commit SHAs.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.29.0
        with:
          sarif_file: results.sarif
