name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-22.04
    permissions:
      security-events: write # Upload Scorecard SARIF to code scanning.
      id-token: write # Publish signed Scorecard results.
      contents: read # Read repository contents.
      actions: read # Inspect workflow metadata for Scorecard checks.
      issues: read # Inspect issue activity for maintenance signals.
      pull-requests: read # Inspect PR review metadata.
      checks: read # Inspect check-run metadata.
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        # Floating `@v2` tag was removed by OSSF; pin to specific release.
        # SHA below is the commit SHA (not the annotated-tag-object SHA);
        # scorecard's imposter-commit verification only accepts commit SHAs.
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.0
        with:
          sarif_file: results.sarif
