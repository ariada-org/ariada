name: CodeQL

# Static-analysis workflow that runs the CodeQL engine against the
# repository's JavaScript and TypeScript source on every push to the
# main branch, every pull request whose base is main or release-base,
# and once a week. Results land in the Security tab under
# Code Scanning.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, release-base]
  schedule:
    - cron: "23 4 * * 1" # Monday 04:23 UTC — full weekly sweep
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: "/language:${{ matrix.language }}"
