#
# Reusable workflow — EAA audit pipeline
# ----------------------------------------------------------------------------
# Callers reference this file with one `uses:` line:
#
#   jobs:
#     audit:
#       uses: ariada-org/ariada/.github/workflows/eaa-audit.yml@v1
#       with:
#         site-url: 'https://example.com'
#
# The workflow installs Node 22 + pnpm + axe-core + `@ariada-org/wcag-rules-extended`,
# scans the URLs you pass in, posts a PR comment with the violation summary,
# uploads a SARIF report (consumed by GitHub Security / code-scanning), and
# uploads an artefact bundle (`report.json` + optional accessibility-statement
# HTML + optional VPAT / `.well-known/accessibility.json`).
#
# Inputs / outputs reference: packages/eaa-pipeline/docs/INPUTS.md +
# packages/eaa-pipeline/docs/OUTPUTS.md.
#
# This workflow is patent-safe by construction — it runs the open-source rule
# pack only. See packages/eaa-pipeline/NOTICE for the Patent Peace Pledge.

name: EAA audit (reusable)

on:
  workflow_call:
    inputs:
      site-url:
        description: 'Base URL to scan. Must be https:// and publicly reachable.'
        required: true
        type: string
      pages:
        description: 'Comma-separated paths to append to site-url (e.g. "/,/about/,/checkout/"). Default: "/".'
        required: false
        type: string
        default: '/'
      fail-on:
        description: 'Comma-separated axe-core impact levels that fail the job. Allowed: minor,moderate,serious,critical.'
        required: false
        type: string
        default: 'serious,critical'
      emit-statement:
        description: 'If true, emit accessibility-statement.html artefact.'
        required: false
        type: boolean
        default: true
      emit-evidence:
        description: 'If true, emit vpat.json + accessibility.json artefacts.'
        required: false
        type: boolean
        default: true
      pack-version:
        description: 'npm dist-tag or semver of @ariada-org/wcag-rules-extended (default: next).'
        required: false
        type: string
        default: 'next'
      runner:
        description: 'GitHub Actions runner label. Default: ubuntu-latest.'
        required: false
        type: string
        default: 'ubuntu-latest'
      locale:
        description: 'BCP-47 locale tag for emitted accessibility statement (e.g. sv, en, de, fr). Default: en.'
        required: false
        type: string
        default: 'en'

    outputs:
      violations-count:
        description: 'Total violations across all scanned pages, summed across impact levels.'
        value: ${{ jobs.audit.outputs.violations-count }}
      report-artefact:
        description: 'Name of the uploaded artefact bundle (eaa-audit-<run_id>).'
        value: ${{ jobs.audit.outputs.report-artefact }}
      sarif-uploaded:
        description: "'true' iff SARIF upload step succeeded (per the package contract)."
        value: ${{ jobs.audit.outputs.sarif-uploaded }}
      status:
        description: 'One of pass | fail | error (per the package contract).'
        value: ${{ jobs.audit.outputs.status }}

# Keep the workflow-level token read-only; the single `audit` job below grants
# only the extra write scopes it actually uses (PR comment + SARIF upload).
permissions:
  contents: read

jobs:
  audit:
    name: EAA audit
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post PR comment
      security-events: write # upload SARIF to GitHub Security
      actions: read
    outputs:
      violations-count: ${{ steps.scan.outputs.violations-count }}
      report-artefact: ${{ steps.scan.outputs.report-artefact }}
      sarif-uploaded: ${{ steps.sarif-upload-status.outputs.uploaded }}
      status: ${{ steps.enforce.outputs.status }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout ariada-org/ariada (helper scripts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ariada-org/ariada
          ref: ${{ github.action_ref || 'main' }}
          path: .ariada-workflow
          persist-credentials: false
          sparse-checkout: |
            packages/eaa-pipeline/scripts

      - name: Validate inputs
        id: validate
        env:
          SITE_URL: ${{ inputs.site-url }}
          FAIL_ON: ${{ inputs.fail-on }}
          PACK_VERSION: ${{ inputs.pack-version }}
          PAGES: ${{ inputs.pages }}
        # Exit 2 on input failures per the exit-code policy.  Trailing slash on
        # SITE_URL is stripped here so downstream URL concatenation
        # never produces `//` artefacts.  Lenient `/` prepend on
        # PAGES entries per the supply-chain policy.  PACK_VERSION must be an
        # npm-registry spec — `git+`, `file:`, `link:` are rejected
        # so the workflow cannot be coerced into installing arbitrary
        # source from outside the public npm registry.
        run: |
          set -eu
          if [[ ! "$SITE_URL" =~ ^https:// ]]; then
            echo "::error::site-url must start with https:// (got: $SITE_URL)"
            exit 2
          fi
          # fail-on must be one of: minor,moderate,serious,critical (comma-list)
          IFS=',' read -ra LEVELS <<< "$FAIL_ON"
          for lvl in "${LEVELS[@]}"; do
            lvl_trimmed="${lvl// /}"
            case "$lvl_trimmed" in
              minor|moderate|serious|critical) ;;
              *) echo "::error::fail-on contains invalid level: $lvl_trimmed (allowed: minor,moderate,serious,critical)"; exit 2;;
            esac
          done
          # pack-version security policy — npm registry only.
          case "$PACK_VERSION" in
            git+*|file:*|link:*|http:*|https:*)
              echo "::error::pack-version must be an npm-registry spec (got: $PACK_VERSION). git+/file:/link:/http(s): are rejected per the supply-chain policy supply-chain policy."
              exit 2
              ;;
          esac
          # Strip trailing slash on SITE_URL — surface to downstream steps.
          SITE_URL_NORM="${SITE_URL%/}"
          echo "site-url-normalised=${SITE_URL_NORM}" >> "$GITHUB_OUTPUT"
          # Lenient `/` prepend on each PAGES entry — surface normalised list.
          PAGES_NORM=""
          IFS=',' read -ra ENTRIES <<< "$PAGES"
          for entry in "${ENTRIES[@]}"; do
            trimmed="$(echo "$entry" | xargs)"
            [[ -z "$trimmed" ]] && continue
            [[ "$trimmed" != /* ]] && trimmed="/$trimmed"
            PAGES_NORM="${PAGES_NORM:+$PAGES_NORM,}$trimmed"
          done
          [[ -z "$PAGES_NORM" ]] && PAGES_NORM="/"
          echo "pages-normalised=${PAGES_NORM}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        # Version pinned via package.json `packageManager`.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '9.15.0'

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install scanner toolchain
        env:
          PACK_VERSION: ${{ inputs.pack-version }}
        # Per the exit-code policy exit-code 4 is reserved for toolchain install
        # failures.  pnpm has built-in 3 retries with exponential
        # backoff; we wrap the call so the final-failure outcome
        # surfaces as exit 4 (`scan-stderr.log` captures pnpm's last
        # error for the troubleshooting workflow).
        run: |
          set -eu
          mkdir -p .ariada-scratch
          cd .ariada-scratch
          cat > package.json <<EOF
          {
            "name": "ariada-scratch",
            "version": "0.0.0",
            "private": true,
            "type": "module"
          }
          EOF
          if ! pnpm add --save-dev "axe-core@^4" "@axe-core/cli@^4" "@ariada-org/wcag-rules-extended@${PACK_VERSION}" 2> install-stderr.log; then
            echo "::error::scanner toolchain install failed (pnpm add returned non-zero) — exit 4 per the exit-code policy"
            sed 's/^/  /' install-stderr.log >&2 || true
            exit 4
          fi

      - name: Run EAA scan
        id: scan
        env:
          SITE_URL: ${{ steps.validate.outputs.site-url-normalised }}
          PAGES: ${{ steps.validate.outputs.pages-normalised }}
          FAIL_ON: ${{ inputs.fail-on }}
          EMIT_STATEMENT: ${{ inputs.emit-statement }}
          EMIT_EVIDENCE: ${{ inputs.emit-evidence }}
          LOCALE: ${{ inputs.locale }}
          RUN_ID: ${{ github.run_id }}
        # The scan invocation below references `bin/run-eaa-audit.mjs` inside
        # `@ariada-org/wcag-rules-extended`. That entry-point ships alongside
        # `@ariada-org/cli` — until both are published, the workflow YAML is
        # the source-of-truth contract; the runtime artefact is the per-package
        # responsibility of the rule pack.
        #
        # Exit-code wrapper per the exit-code wrapper policy:
        #   rule-pack internal codes  → workflow exit codes
        #     10                      → 2 (validation)
        #     11                      → 3 (network unreachable after retries)
        #     12                      → 4 (install — handled by previous step)
        #     13                      → 5 (runtime / browser crash)
        #     0                       → 0 (audit clean — policy decision in §enforce)
        #     other non-zero          → 1 (policy fail or unknown)
        run: |
          set +e
          mkdir -p eaa-out
          # Guard: the scanner entry-point must exist. If the rule-pack runtime
          # has not shipped `bin/run-eaa-audit.mjs` yet, fail LOUDLY here — a
          # missing binary otherwise lets the run fall through to an empty
          # report and a false "0 violations / clean" verdict, which is worse
          # than a hard failure. Maps to exit 4 (install-class) per the policy.
          SCANNER="./.ariada-scratch/node_modules/@ariada-org/wcag-rules-extended/bin/run-eaa-audit.mjs"
          if [ ! -f "$SCANNER" ]; then
            echo "::error::EAA scanner entry-point not found at $SCANNER — the @ariada-org/wcag-rules-extended rule-pack runtime has not shipped run-eaa-audit.mjs yet. Failing instead of reporting a false-clean result."
            exit 4
          fi
          node --experimental-vm-modules \
            "$SCANNER" \
            --site-url "$SITE_URL" \
            --pages "$PAGES" \
            --fail-on "$FAIL_ON" \
            --emit-statement "$EMIT_STATEMENT" \
            --emit-evidence "$EMIT_EVIDENCE" \
            --locale "$LOCALE" \
            --out-dir "eaa-out" 2> >(tee eaa-out/scan-stderr.log >&2)
          scan_exit=$?
          set -e
          case $scan_exit in
            0)  ;;
            10) echo "::error::scanner returned input-validation error (code 10) — mapping to exit 2"; exit 2 ;;
            11) echo "::error::scanner returned network error (code 11) — mapping to exit 3 per the exit-code policy"; exit 3 ;;
            12) echo "::error::scanner returned install error (code 12) — mapping to exit 4"; exit 4 ;;
            13) echo "::error::scanner returned runtime crash (code 13) — mapping to exit 5 per the exit-code policy"; exit 5 ;;
            *)
              echo "::warning::scanner returned code $scan_exit — treating as policy-related; enforce step will decide PASS/FAIL"
              ;;
          esac
          # Surface scalar outputs for the workflow caller (best-effort —
          # only if `report.json` was produced).
          if [[ -f eaa-out/report.json ]]; then
            violations_count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eaa-out/report.json','utf8')).totalViolations || 0)")
            echo "violations-count=${violations_count}" >> "$GITHUB_OUTPUT"
          else
            echo "violations-count=0" >> "$GITHUB_OUTPUT"
          fi
          echo "report-artefact=eaa-audit-${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build SARIF fallback (if rule-pack did not emit)
        if: always() && hashFiles('eaa-out/report.json') != '' && hashFiles('eaa-out/report.sarif') == ''
        # When the rule-pack runtime (`bin/run-eaa-audit.mjs`) does NOT
        # emit `report.sarif` itself, fall back to a deterministic
        # SARIF 2.1.0 builder that maps axe-core impact → SARIF level
        # per the severity-mapping policy (critical/serious → error; moderate → warning;
        # minor → note).  Caps results at 25 000 per GitHub policy.
        run: |
          set -eu
          node .ariada-workflow/packages/eaa-pipeline/scripts/build-sarif-from-report.mjs \
            eaa-out/report.json \
            eaa-out/report.sarif

      - name: Validate SARIF schema (best-effort)
        if: always() && hashFiles('eaa-out/report.sarif') != ''
        # Schema sanity check before uploading.  Catches malformed
        # SARIF early so we don't get a confusing failure from the
        # GitHub upload action.  Best-effort: validation findings
        # log a warning but do NOT fail the job — the artefact
        # remains valuable even if the SARIF cannot be ingested by
        # GitHub Security UI.
        run: |
          set -eu
          cat > /tmp/sarif-validate.mjs <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateSarif } from './.ariada-workflow/packages/eaa-pipeline/scripts/build-sarif-from-report.mjs';
          const sarif = JSON.parse(readFileSync('eaa-out/report.sarif', 'utf8'));
          const errs = validateSarif(sarif);
          if (errs.length > 0) {
            for (const e of errs) console.warn('::warning::SARIF validation: ' + e);
          } else {
            const n = sarif.runs?.[0]?.results?.length ?? 0;
            console.log('SARIF 2.1.0 schema validation: OK (' + n + ' results)');
          }
          NODE
          node /tmp/sarif-validate.mjs || echo "::warning::SARIF validator crashed (non-fatal)"

      - name: Upload SARIF to GitHub Security
        id: sarif-upload
        if: always() && hashFiles('eaa-out/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: eaa-out/report.sarif
          category: ariada-eaa

      - name: Record SARIF upload status
        id: sarif-upload-status
        if: always()
        env:
          SARIF_OUTCOME: ${{ steps.sarif-upload.outcome }}
        # Drives the sarif-uploaded workflow output.
        # `outcome` is one of success / failure / skipped / cancelled —
        # we collapse to a boolean string for downstream consumption.
        run: |
          set -eu
          case "$SARIF_OUTCOME" in
            success) echo "uploaded=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "uploaded=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload artefact bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eaa-audit-${{ github.run_id }}
          path: eaa-out/
          if-no-files-found: warn
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always() && hashFiles('eaa-out/report.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Comment body is rendered by `render-pr-comment.mjs` to keep
          # the markdown layout single-sourced + unit-tested.  See
          # packages/eaa-pipeline/scripts/render-pr-comment.mjs +
          # tests/unit/render-pr-comment.test.mjs.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # `actions/github-script@v7` provides retry semantics on the
          # GitHub REST client.  We catch the call in a try/catch so a
          # rate-limit or transient API failure does NOT fail the job
          # (per the PR-comment policy — comment failures degrade gracefully).
          script: |
            const { execFileSync } = require('child_process');
            let body;
            try {
              body = execFileSync(
                'node',
                [
                  '.ariada-workflow/packages/eaa-pipeline/scripts/render-pr-comment.mjs',
                  'eaa-out/report.json',
                  '--run-id', String(context.runId),
                  '--run-url', process.env.RUN_URL || '',
                ],
                { encoding: 'utf8', maxBuffer: 1024 * 1024 },
              );
            } catch (err) {
              core.warning(`PR-comment renderer crashed: ${err.message}`);
              return;
            }
            // Final safety net: hard-cap to GitHub's 65 536-char limit.
            const MAX = 65_536;
            if (body.length > MAX) {
              body = body.slice(0, MAX - 200) + '\n\n_... truncated to GitHub comment cap, see artefact for full body._';
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            } catch (err) {
              if (err.status === 403 || err.status === 429) {
                core.warning(`PR-comment rate-limited (${err.status}); retrying once after 60s`);
                await new Promise((r) => setTimeout(r, 60_000));
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    body,
                  });
                } catch (retryErr) {
                  core.warning(`PR-comment retry failed: ${retryErr.message} — job continues`);
                }
              } else {
                core.warning(`PR-comment failed: ${err.message} — job continues`);
              }
            }

      - name: Enforce fail-on policy
        id: enforce
        env:
          FAIL_ON: ${{ inputs.fail-on }}
        # Drives the `status` workflow output (pass | fail | error) per
        # the package contract.  Exit 1 on policy fail per the exit-code policy.  Exit 0 (with
        # status=error) when `report.json` is missing — at that point
        # an earlier step has already produced an `::error::` annotation
        # so the job conclusion will be `failure` via the failed step.
        run: |
          set -eu
          if [[ ! -f eaa-out/report.json ]]; then
            echo "::warning::report.json missing — scan never produced output (likely runtime/network failure)"
            echo "status=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eaa-out/report.json','utf8')).verdict || 'unknown')")
          if [[ "$verdict" == "FAIL" ]]; then
            echo "::error::EAA audit FAIL — one or more violations at impact level(s) $FAIL_ON"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "EAA audit PASS"
