#
# Dependabot — automated dependency updates.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Design decisions:
#   - npm/github-actions: security updates only. Routine version-update PRs are
#     intentionally disabled so dependency bumps do not clog the public drip
#     queue or bypass the small-commit release policy.
#   - Security PRs stay enabled and grouped by ecosystem; they are reviewed as
#     remediation work, not as routine dependency churn.
#   - assignees: @predopta (current owner; rotate to @ariada-org/maintainers post-org-handoff).
#   - Conventional-commit prefixes: `fix(security)` for actual remediation.
#
# Activates automatically on push to a GitHub-hosted repo. Until first
# public push it sits dormant; no action items emitted.

version: 2

updates:
  # ───────────────────────────────────────────────────────────────────
  # 1. npm — security updates only
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    # Disable routine version-update PRs. Dependabot security updates are still
    # allowed and grouped below via `applies-to: security-updates`.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
    assignees:
      - predopta
    commit-message:
      prefix: 'fix'
      prefix-development: 'fix'
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # ───────────────────────────────────────────────────────────────────
  # 2. github-actions — security updates only
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    assignees:
      - predopta
    commit-message:
      prefix: 'fix'
      include: scope
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
