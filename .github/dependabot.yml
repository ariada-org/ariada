#
# Dependabot configuration for the Ariada monorepo (pnpm workspaces + Turborepo).
#
# Goals:
#  - Minimise PR-spam by grouping related updates into a single weekly PR per ecosystem.
#  - Keep dev-only tooling separate from production runtime dependencies so review effort
#    matches risk profile.
#  - Schedule on Tuesday morning UTC to stay clear of the OpenSSF Scorecard cron and
#    standard end-of-week deploy freezes.
#  - Use Conventional Commits so the commit-message lint hook accepts Dependabot PRs.
#
# Note: Dependabot *security* updates (CVE-driven) are configured separately under
# repo Settings -> Code security and analysis, not in this file. The schedule below
# only governs *version* updates.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm / pnpm workspaces — single root manifest covers all packages.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      # Dev tooling — bundled into one PR. Low runtime risk, high update frequency.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      # Type definitions — bundle these too; they only affect compile-time.
      typescript-types:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      # ESLint ecosystem — flat-config plugins move in lockstep.
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
      # Test framework — vitest + helpers.
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
        update-types:
          - minor
          - patch
      # Playwright — browser binary + runner versioned together.
      playwright:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "@playwright/*"
        update-types:
          - minor
          - patch
      # Turborepo + build tooling.
      build-tooling:
        applies-to: version-updates
        patterns:
          - "turbo"
          - "tsup"
          - "tsx"
          - "typescript"
          - "prettier"
        update-types:
          - minor
          - patch
      # Production runtime dependencies — minor/patch grouped, MAJOR stays separate
      # so a breaking-change bump gets its own focused review.
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions — pinned by SHA per OpenSSF Scorecard recommendation.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: tuesday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
      include: scope
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
