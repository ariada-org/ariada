#
# Dependabot — automated dependency updates.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Design decisions:
#   - npm: weekly minor+patch grouped (low-noise); majors as separate PRs.
#   - github-actions: monthly grouped (founder-approved cadence).
#   - assignees: @predopta (current owner; rotate to @ariada-org/maintainers post-org-handoff).
#   - Conventional-commit prefixes: chore(deps), chore(actions).
#
# Activates automatically on push to a GitHub-hosted repo. Until first
# public push it sits dormant; no action items emitted.

version: 2

updates:
  # ───────────────────────────────────────────────────────────────────
  # 1. npm — weekly minor+patch grouped, majors separately
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: '/'
    # DIRECTORIES THAT RECORD RATHER THAN RUN.
    #
    # A `recovered/` directory holds what a packed archive contained, read back
    # out because none of it was in the repository's history and one routine
    # clean would have taken it. Its versions are the archive's versions. An
    # automatic bump there does not fix anything — it edits a record of what
    # something was, and the next person comparing the two finds a difference
    # nobody made on purpose.
    #
    # A `runtime/` directory under an integration is the same conclusion by
    # another route: it holds the packed runtime a host installs, its manifest
    # is exact by design, and for openedx a test asserts exactly that — so a
    # bump breaks a passing test, correctly.
    #
    # Written for every integration rather than for openedx alone, because the
    # second one arrived the day after the first: unpacking the Moodle plugin
    # brought `integrations/moodle-ariada/runtime/package.json` into the
    # repository, and the guard went red within the minute. Naming them one at
    # a time makes each new archive a small surprise; naming the shape makes it
    # none.
    #
    # Every exact pin in this repository that sits below what the workspace
    # resolves is under one of these paths. Not most of them — all of them,
    # which is why this is one decision rather than a hundred and fifty.
    exclude-paths:
      - '**/recovered/**'
      - 'integrations/*/runtime/**'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    assignees:
      - predopta
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      axe-core:
        patterns:
          - 'axe-core'
          - '@axe-core/*'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # ───────────────────────────────────────────────────────────────────
  # 2. github-actions — monthly grouped
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    assignees:
      - predopta
    commit-message:
      prefix: 'chore(actions)'
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ───────────────────────────────────────────────────────────────────
  # 3. docker — the base images, so their digests can be pinned
  # ───────────────────────────────────────────────────────────────────
  # A base image named by a moving tag is a different image on every build,
  # which is not something the person running a pipeline can review. Naming
  # it by digest fixes that — and stops it receiving the patches the tag
  # would have brought, unless something moves the digest forward.
  #
  # So this comes first and the pinning follows. Pinning without a bot to
  # bump the digest trades a reviewable build for an unpatched one, which is
  # the worse of the two.
  #
  # One image build is deliberately absent: the one under confluence-ariada's
  # `recovered/`, which is kept as evidence of what an archive contained.
  # Moving its base image forward would spoil the evidence, and nobody builds
  # it. A guard holds that reason to the file, so a fourth build appearing
  # tomorrow is noticed rather than assumed.
  - package-ecosystem: docker
    directory: '/integrations/bitbucket-pipe-ariada'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
  - package-ecosystem: docker
    directory: '/integrations/docker-ariada'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
  - package-ecosystem: docker
    directory: '/packages/ariada-bitbucket-pipe'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
