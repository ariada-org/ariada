#
# Dependabot — automated dependency updates.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Design decisions:
#   - npm: weekly owner-scoped minor+patch groups only; no broad dependency dump.
#     Ungrouped dependencies open separate PRs so the release queue can keep
#     one reviewable change per public commit.
#   - github-actions: monthly grouped (founder-approved cadence).
#   - assignees: @predopta (current owner; rotate to @ariada-org/maintainers post-org-handoff).
#   - Conventional-commit prefixes: `chore` with Dependabot's own scope.
#
# Activates automatically on push to a GitHub-hosted repo. Until first
# public push it sits dormant; no action items emitted.

version: 2

updates:
  # ───────────────────────────────────────────────────────────────────
  # 1. npm — weekly minor+patch grouped, majors separately
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    assignees:
      - predopta
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      typescript:
        applies-to: version-updates
        patterns:
          - 'typescript'
          - '@types/*'
        update-types:
          - minor
          - patch
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
        update-types:
          - minor
          - patch
      vitest:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - minor
          - patch
      axe-core:
        applies-to: version-updates
        patterns:
          - 'axe-core'
          - '@axe-core/*'
        update-types:
          - minor
          - patch
      playwright:
        applies-to: version-updates
        patterns:
          - 'playwright'
          - '@playwright/*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # ───────────────────────────────────────────────────────────────────
  # 2. github-actions — monthly grouped
  # ───────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '08:00'
      timezone: 'Europe/Stockholm'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    assignees:
      - predopta
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
