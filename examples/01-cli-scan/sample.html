Intentionally-broken sample page used by the cli-scan example to
demonstrate the ariada CLI catching common WCAG 2.2 AA violations.
This file is NOT a model to copy — every block below is annotated
with the violation it triggers.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ariada CLI scan — broken sample page</title>
  </head>
  <body>
    <!-- WCAG 1.1.1 — image without alt text -->
    <img src="logo.png" />

    <!-- WCAG 1.3.1 — input without an associated label -->
    <form>
      <input type="email" name="email" placeholder="Email" />

      <!-- WCAG 1.3.5 — credit-card input missing autocomplete hint -->
      <input type="text" name="card_number" placeholder="Card number" />

      <!-- WCAG 3.3.2 — submit control with no accessible name -->
      <button type="submit"></button>
    </form>

    <!-- WCAG 2.4.4 — link with no discernible text -->
    <a href="/checkout"></a>

    <!-- WCAG 1.4.3 — low-contrast text -->
    <p style="color: #cccccc; background: #ffffff;">Hard-to-read paragraph.</p>
  </body>
</html>
