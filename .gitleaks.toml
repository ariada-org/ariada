#
# gitleaks configuration for the ariada monorepo.
#
# Extends the upstream default ruleset and adds an allowlist for paths that
# legitimately contain synthetic, non-functional secret-shaped strings used as
# detector test fixtures (e.g. the content-policy package's secret-leak rule
# pack and its tests). These are fake tokens that exist only to prove the
# scanner fires — they are not real credentials.

title = "ariada gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow synthetic secret-shaped fixtures and research/patent/strategy data"
paths = [
  '''packages/ariada-content-policy/test/.*''',
  '''packages/ariada-content-policy/src/rule-packs/.*''',
  # Research datasets, patent drafts, strategy docs — contain example tokens
  # and synthetic strings used as prior-art evidence, not real credentials.
  '''research/.*''',
  '''patents/.*''',
  '''strategy/.*''',
  '''docs/internal/.*''',
  '''data/.*''',
  # Large binary/data files that trigger false positives
  '''research/poc/.*/datasets/.*\.jsonl$''',
]
